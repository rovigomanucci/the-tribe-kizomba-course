name: Validate teaching guide

on:
  push:
    branches:
      - main
    paths:
      - 'classes/**'
      - 'curriculum/**'
      - 'library/**'
      - 'scripts/**'
      - 'index.html'
      - 'README.md'
      - 'DECISIONS.md'
      - 'CHANGELOG.md'
      - 'DEPLOYMENT.md'
      - 'AGENTS.md'
      - '.github/workflows/rebuild-site.yml'
  pull_request:
    paths:
      - 'classes/**'
      - 'curriculum/**'
      - 'library/**'
      - 'scripts/**'
      - 'index.html'
      - 'README.md'
      - 'DECISIONS.md'
      - 'CHANGELOG.md'
      - 'DEPLOYMENT.md'
      - 'AGENTS.md'
      - '.github/workflows/rebuild-site.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate teaching guide
        run: node scripts/check-site.mjs

      - name: Confirm committed guide is current
        run: git diff --exit-code -- index.html
