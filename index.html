hanging the standing foot or forcing the partner.","errors":["Tap carries weight: “Touch and remain on the standing foot.”","Leader moves the follower's leg: “Create the pause and direction, do not place the foot.”","Tap becomes a styling competition: “Keep the action functional and small.”"],"safety":[],"rotation":"","transition":"Use one timing choice inside a limited social flow."},{"time":"35–42 min","title":"Three-family flow with one timing choice","purpose":"Build choice-making before the final song without overloading students.","leader":["Ask leaders to select only three movement families.","Require one pause or tap choice and one recovery.","Encourage repetition and clear transitions.","Reinforce that cha-cha needs lateral space and redirection needs a clear exit."],"follower":["Demonstrate following limited vocabulary with no known order.","Observe anticipation and adaptation.","Reinforce relaxed connection and available posture."],"task":["Select three movement families.","Use them in any order.","Add one pause, tap, or delayed exit.","Include one recovery through Marca or Basic 3.","Do not add a fourth family until the flow is stable."],"success":"Couples create a coherent flow using limited vocabulary and one clear timing choice.","errors":[],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Use the new partner for an adaptability round before the full song."},{"time":"42–47 min","title":"New-partner adaptability round","purpose":"Test whether students communicate instead of reproducing movement size and timing from the prior partner.","leader":["Ask leaders to start simply with Marca and Basic 3.","Delay cha-cha, Saídas, and redirection until the connection is stable.","Encourage smaller movement with an unfamiliar partner."],"follower":["Reinforce waiting for new partner information.","Observe whether followers assume the prior partner's range or timing."],"task":["Begin with simple basics.","Establish connection and pulse.","Add one selected movement family and one timing choice after flow is stable.","Adapt movement size and connection to the new partner."],"success":"Couples establish comfortable flow with a new partner before adding complexity.","errors":[],"safety":[],"rotation":"","transition":"Explain the complete-song task and its reduced-vocabulary success criteria."},{"time":"47–58 min","title":"Complete-song social dance","purpose":"Deliver the Level 1 outcome and observe independent social dancing.","leader":["Start one complete beginner-friendly song.","Give opening reminders only: start simply, check the floor, recover early, and use fewer movements.","Stop speaking after the opening phase.","Observe without interrupting individual mistakes."],"follower":["Observe balance, anticipation, comfort, and recovery.","Join temporarily only when role numbers require it.","Record broad patterns for after-class review."],"task":["At least three movement families","One selected rhythm or timing choice, such as cha-cha, pause, or tap","One Saída or compact redirection when safe and clear","One recovery through Marca or Basic 3"],"success":"Most couples complete the song with continuous flow, safe floorcraft, and at least one visible recovery.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Course recap and next-step reflection","purpose":"","leader":["Recap Level 1 principles: pulse, complete transfer, connection, choice, floorcraft, and recovery.","Name cha-cha as core Level 1 vocabulary.","Emphasise that social-dance independence matters more than figure quantity."],"follower":["Reinforce personal balance, response, consent, and adaptation.","Invite students to identify one strength and one practice priority."],"task":["Reflect on the complete-song experience.","Identify one movement family they trust.","Identify one technical skill needing more practice."],"success":"","errors":[],"safety":[],"rotation":"","transition":""}]}]},{"id":"level-2","level":2,"name":"Fusion Techniques and Musicality","descriptor":"Develop controlled Fusion technique, preparation, and safe exits.","readiness":"Requires reliable Level 1 weight transfer, stops, Saídas, and open connection.","lessons":[{"id":"l2w1","level":2,"week":1,"title":"Cross and Redirect","status":"Draft — Test in class","promise":"By the end of the class, students will be able to create a low, controlled foot block and a simple leg cross only after identifying the partner's free leg, then recover into walking without kicking, forcing, or carrying the partner's weight.","movement":["Free-leg recognition","Prepared stop","Follower foot block","Leader foot block","Simple cross and return","Return to walking or Basic 3"],"foundation":["Contact only the clearly free leg.","Establish balance before contact.","Keep contact low, soft, and brief.","Guide the pathway rather than striking or trapping the foot.","Both partners retain their own body weight.","Replace the free foot before transferring weight."],"prerequisites":["Students should already demonstrate reliable Basic 3, controlled stopping, compact Saídas, complete weight transfer, personal balance, and responsive partner connection."],"core":["Prepared stop","Free-leg recognition","One follower foot block","One simple cross and return","Recovery to Basic 3"],"progressing":["Leader foot block","Entry from Follower Saída","Cross with a small direction change","Adapt contact and range to a new partner"],"challenge":["Contratempo exit","Alternative entry from Saída","Pivot preparation after a completed cross"],"entries":[],"exits":[],"social":[],"errors":["Contacting the weighted leg: “No contact until the free leg is certain.”","Kicking instead of guiding: “Place and guide; never strike.”","Contact near knee or ankle joint: “Move contact lower and remove pressure.”","Follower gives body weight: “Keep your axis over the standing leg.”","Leader forces the cross: “Guide the pathway and allow the partner to respond.”","Action repeats continuously: “One action, then return to dancing.”"],"safety":["Leg contact is optional and may be declined at any time.","Contact stays low, soft, and away from joints.","No pressure against the knee or ankle.","Stop immediately if the partner resists, stiffens, or loses alignment.","Both partners carry their own body weight.","Teachers explain corrections before physical contact."],"questions":["Is the leader foot block necessary in the first Level 2 class or better retained as progressing content?","Can the weakest admitted student recognise the free leg consistently?","Which entry produces the clearest preparation?","Does the one-action-per-phrase rule improve restraint?","Which musical texture best supports quiet contact and recovery?"],"previous":"Level 1 completion","next":"Level 2, Week 2","detailed":true,"sequence":[{"time":"0–5 min","title":"Welcome and Level 1 assessment recap","purpose":"Confirm that the room is ready for controlled leg-contact work.","leader":["State the class promise and safety boundary.","Lead Basic 3, stop, restart, and Follower Saída recap.","Observe weight clarity and stopping control."],"follower":["Demonstrate complete weight transfer and stable stops.","Identify students who need the core version only.","Reinforce that advanced elements remain optional."],"task":["Dance Basic 3, stop on request, identify the weighted foot, and restart without an adjustment step."],"success":"Most students stop with one clearly weighted leg and one relaxed free leg.","errors":[],"safety":[],"rotation":"","transition":"Continue individually and isolate free-leg recognition."},{"time":"5–11 min","title":"Own free-leg recognition","purpose":"Make weight status observable before partner contact is introduced.","leader":["Guide step, stop, and free-foot checks.","Ask students to lift or trace the free foot without shifting the standing side.","Demonstrate unclear split weight versus a stable axis."],"follower":["Show the drill from another angle.","Observe collapsed standing hips, locked knees, and hidden weight changes."],"task":["Step, stop, identify the free leg, move it slightly, replace it, and restart."],"success":"Students can move the free foot without hopping or transferring weight accidentally.","errors":["Split weight: “Choose one standing leg before moving the other.”","Free foot carries weight: “Make the moving foot light enough to leave the floor.”","Standing side collapses: “Grow through the standing leg without locking it.”"],"safety":[],"rotation":"","transition":"Form partners and recognise weight without leg contact."},{"time":"11–17 min","title":"Partner weight-reading drill","purpose":"Teach recognition through connection rather than visual guessing.","leader":["Demonstrate a prepared stop from Basic 3.","Show how the leader waits until the follower completes the transfer.","Test the pathway through a very small directional invitation, without touching the leg."],"follower":["Explain the follower experience of completing and settling weight.","Demonstrate why anticipation hides the free leg.","Observe followers who brace or lean."],"task":["Leaders stop, wait, and identify the likely free leg. Followers complete the transfer and remain balanced without presenting or lifting the leg deliberately."],"success":"Couples identify the free side consistently without verbal coordination.","errors":["Leader guesses early: “Wait until the transfer is complete.”","Follower presents the leg: “Remain neutral and available.”","Connection becomes rigid: “Use the frame to listen, not to hold.”"],"safety":[],"rotation":"Rotate once.","transition":"Add low contact for the follower foot block."},{"time":"17–24 min","title":"Follower foot block","purpose":"Create the first controlled block against a clearly free foot.","leader":["Demonstrate Basic 3, prepared stop, weight check, and low block.","Show contact near the foot rather than the knee.","Demonstrate immediate release when alignment changes.","Contrast guiding with kicking."],"follower":["Demonstrate maintaining personal axis.","Explain that the blocked foot remains free and relaxed.","Show the safe response when contact is unexpected: stop and reset."],"task":["Enter from Basic 3, stop, establish the free leg, create one light block, release, replace the foot, and return to walking."],"success":"Blocks remain low and quiet, with no visible impact or loss of balance.","errors":["Contact on the weighted leg: “No action until the free leg is certain.”","Kicking: “Place contact; do not strike.”","Follower leans: “Keep your weight over your standing foot.”"],"safety":[],"rotation":"","transition":"Reverse the responsibility and teach the leader foot block."},{"time":"24–30 min","title":"Leader foot block","purpose":"Develop shared responsibility and prevent the lesson becoming follower-only manipulation.","leader":["Demonstrate presenting a genuinely free leader foot.","Keep the body balanced and the contact pathway small.","Show how to replace the foot before continuing."],"follower":["Demonstrate the corresponding low block or guided contact.","Reinforce waiting for the leader's weight to settle.","Observe excessive force or reaching."],"task":["Create one leader free-foot opportunity, one low block, release, replace, and return to Basic 3."],"success":"The leader remains independently balanced and the contact does not interrupt the pulse.","errors":["Leader gives body weight: “Offer the free foot, not your balance.”","Partner reaches with the leg: “Reduce the distance before creating contact.”","Foot remains trapped: “Release before the next transfer.”"],"safety":[],"rotation":"","transition":"Use the same preparation to create a simple cross."},{"time":"30–37 min","title":"Simple cross and return","purpose":"Convert free-leg guidance into a clear cross without force.","leader":["Demonstrate the prepared stop and free-leg pathway.","Guide a small cross and pause before weight transfer.","Show the return to neutral and walking.","Emphasise pathway first, transfer second."],"follower":["Demonstrate allowing the free leg to travel while keeping the standing side stable.","Explain that the follower does not transfer until invited.","Observe accidental crossing of the weighted leg."],"task":["Prepare, guide one free leg across, pause, replace or transfer only when clear, and return to Basic 3."],"success":"The cross is created without pulling the torso, forcing the leg, or losing the standing axis.","errors":["Cross created before the stop: “Balance first, pathway second.”","Follower transfers automatically: “The crossed position does not require immediate weight.”","Leader pulls the upper body: “Guide the leg pathway through the whole-body direction.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Connect entries and exits with the new partner."},{"time":"37–43 min","title":"Entry and recovery choices","purpose":"Make the action socially usable rather than a fixed exercise.","leader":["Demonstrate entry from Basic 3 and Follower Saída.","Show two recoveries: replace and walk, or return to Basic 3.","Reinforce abandoning the action when weight is unclear."],"follower":["Demonstrate following without knowing whether a block or cross will occur.","Observe anticipation and delayed recovery."],"task":["Use one prepared entry, choose one block or cross, then recover through walking or Basic 3."],"success":"Couples can enter and recover without verbal planning or repeated leg contact.","errors":[],"safety":[],"rotation":"","transition":"Add a controlled direction-change option for progressing students."},{"time":"43–49 min","title":"Cross with direction change","purpose":"Introduce redirection without making contratempo compulsory.","leader":["Demonstrate a small cross, completed balance, then a new walking direction.","Keep the direction change below a quarter turn for the core room.","Offer contratempo exit only to stable couples."],"follower":["Demonstrate completing the current pathway before accepting redirection.","Observe planted-foot twisting."],"task":["Core students cross and return. Progressing students cross, settle, and redirect into a new line."],"success":"Direction changes occur only after both partners are balanced.","errors":["Redirection begins too early: “Complete the cross before choosing the exit.”","Planted knee twists: “Release the foot and turn through the whole body.”"],"safety":[],"rotation":"","transition":"Move into selective social-dance decisions."},{"time":"49–54 min","title":"Selection and restraint drill","purpose":"Teach that blocks and crosses are occasional choices, not continuous decoration.","leader":["Ask leaders to dance mainly with Level 1 vocabulary.","Permit one block or cross per phrase.","Require a clear stop and free-leg check first."],"follower":["Observe whether followers remain neutral and balanced.","Reinforce opting out by returning to walking when the preparation is unclear."],"task":["Dance continuously and use at most one prepared leg action per phrase."],"success":"Couples spend more time dancing than setting up leg actions.","errors":[],"safety":[],"rotation":"Rotate once before final practice.","transition":"State the final social task and reduce teacher prompts."},{"time":"54–58 min","title":"Guided independent social dance","purpose":"","leader":["Use only short prompts: “Stop,” “Read the weight,” “Low contact,” “Release,” and “Recover.”","Intervene immediately for contact near a joint or any forced action."],"follower":["Observe balance, anticipation, and consent signals.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples use isolated, controlled actions and return to social flow without repeated setup.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 2 connection","purpose":"","leader":["Recap preparation, free-leg recognition, low contact, release, and recovery.","Explain that Week 2 extends the same safety standard into leg slides and tracing."],"follower":["Reinforce personal axis and the right to stop any leg action.","Ask which preparation cue felt clearest."],"task":["Name the sequence: stop, identify, guide, release, recover."],"success":"Students understand that uncertainty means abandoning the leg action rather than forcing it.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w2","level":2,"week":2,"title":"Leg Slides and Tracing","status":"Draft — Test in class","promise":"By the end of the class, students will be able to guide a small inside or outside leg slide near the floor while both partners preserve alignment, personal balance, and the option to stop.","movement":["Alignment and range check","Inside leg slide","Outside leg slide","Slide and replace","Entry from prepared cross or open parallel position","Exit to neutral or Basic 3"],"foundation":["Prepare the free leg before contact.","Keep contact light and near the floor.","Follow the natural leg line.","The follower maintains the standing side and active free-leg pathway.","Replace the foot before weight transfer unless a clear cross is prepared.","Smaller range is the default with a new partner."],"prerequisites":["Students should demonstrate the Week 1 sequence: stop, identify the free leg, create low contact, release, and recover. Students unable to maintain weight clarity practise the no-contact pathway."],"core":["Free-leg preparation","Inside slide","Outside slide","Slide and replace","Return to Basic 3"],"progressing":["Entry from prepared cross","Slide into cross","Adapt slide size and direction to a new partner"],"challenge":["Circular tracing","Slide with small direction change","Alternative exit after a completed cross"],"entries":[],"exits":[],"social":[],"errors":["Pressing into a joint: “Move contact lower and remove pressure.”","Dragging the foot: “Make the leg free before moving it.”","Turning the slide into a kick: “Stay connected and reduce speed.”","Follower collapses standing side: “Keep your axis over the standing leg.”","Range exceeds alignment: “Stop at the first structural change.”","Weight transfers before replacement: “Replace first; transfer second.”"],"safety":["Contact remains optional, low, and light.","Avoid all pressure on knees and ankles.","Stop immediately when resistance or misalignment appears.","No forced turnout, stretch, or extended range.","The follower maintains control of the leg pathway and may end it at any time.","Teachers explain corrections before physical contact."],"questions":["Does the no-contact phase sufficiently reduce force?","Which contact point gives clarity without approaching a joint?","Is outside slide too demanding for the weakest admitted student?","Do students adapt range after rotation or repeat the same size?","Which musical texture encourages smooth rather than sharp contact?"],"previous":"Level 2, Week 1","next":"Level 2, Week 3","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 1 recap and readiness check","purpose":"Re-establish free-leg recognition and low-contact standards.","leader":["Lead Basic 3, prepared stop, and one low block.","Restate that resistance means stop, not increased pressure.","Observe whether students contact a clearly free leg."],"follower":["Demonstrate stable standing-side control.","Identify students who should use no-contact tracing."],"task":["Prepare, identify the free leg, create one quiet block, release, and recover."],"success":"Most couples complete the Week 1 action without impact, leaning, or joint contact.","errors":[],"safety":[],"rotation":"","transition":"Separate and explore sliding pathways individually."},{"time":"5–11 min","title":"Individual slide pathway and alignment","purpose":"Teach the follower-side pathway before partner guidance.","leader":["Demonstrate a free foot tracing close to the floor.","Show inside and outside lines within a comfortable range.","Contrast active tracing with dragging a weighted foot."],"follower":["Demonstrate standing-leg alignment, soft knee, and stable pelvis.","Show how range decreases when alignment changes.","Observe collapsed standing sides and locked knees."],"task":["Stand on one leg, trace the free foot inside and outside, replace it, and change sides without losing balance."],"success":"Students move the free foot smoothly while the standing knee remains aligned with the toes.","errors":["Foot drags heavily: “Make the foot light before tracing.”","Standing hip collapses: “Keep the standing side organised.”","Range exceeds control: “Stop before alignment changes.”"],"safety":[],"rotation":"","transition":"Form partners and practise the pathway without leg-to-leg contact."},{"time":"11–16 min","title":"No-contact partner tracing","purpose":"Create shared directional understanding before adding contact.","leader":["Demonstrate preparing the free leg from an open parallel position.","Guide the intended direction through the body and frame only.","Keep the range small."],"follower":["Demonstrate responding with the free leg while maintaining personal axis.","Explain that the follower completes the pathway rather than being pushed through it."],"task":["Leaders prepare and indicate an inside or outside pathway without touching the leg. Followers trace and replace."],"success":"Couples agree on direction without verbal planning or leg contact.","errors":[],"safety":[],"rotation":"Rotate once.","transition":"Add light inside contact."},{"time":"16–23 min","title":"Inside leg slide","purpose":"Teach the first controlled contact pathway near the floor.","leader":["Demonstrate stop, free-leg check, light inside contact, slide, and release.","Show contact below the knee and away from the joint.","Demonstrate how to stop when the follower's range ends."],"follower":["Demonstrate active free-leg participation.","Reinforce keeping the standing side stable.","Show the difference between following contact and surrendering body weight."],"task":["Prepare one inside slide, keep it small, release before weight transfer, replace the foot, and recover to Basic 3."],"success":"The slide remains quiet and low, and the follower can stop it at any point without losing balance.","errors":["Pressure increases with distance: “Range ends when contact stops being light.”","Contact approaches the knee: “Move lower and reduce the pathway.”","Follower becomes passive: “Maintain your own leg and standing side.”"],"safety":[],"rotation":"","transition":"Repeat the same preparation for the outside pathway."},{"time":"23–29 min","title":"Outside leg slide","purpose":"Develop the second slide direction while preserving alignment.","leader":["Demonstrate the outside pathway with reduced range.","Show how to reposition the partnership rather than reaching.","Observe leaders who turn the action into a sweep or kick."],"follower":["Demonstrate maintaining toe and knee alignment.","Observe forced turnout or standing-side collapse."],"task":["Prepare one outside slide, release, replace, and return to neutral."],"success":"The outside slide stays within the follower's natural line and does not rotate the knee.","errors":["Leader reaches with the leg: “Move the partnership closer; do not stretch for contact.”","Follower forces turnout: “Keep the foot in your natural pathway.”","Slide becomes a kick: “Maintain contact and reduce speed.”"],"safety":[],"rotation":"","transition":"Practise replacing the foot cleanly after either slide."},{"time":"29–35 min","title":"Slide and replace","purpose":"Make recovery the default outcome before adding crosses.","leader":["Alternate inside and outside slides.","Clearly release and guide replacement.","Return to Basic 3 after every action."],"follower":["Demonstrate replacing the free foot without transferring early.","Observe followers who leave the leg extended or fall onto it."],"task":["Choose one slide, replace the foot under the body, confirm balance, and walk out."],"success":"Couples recover without hopping, dragging, or an unplanned weight transfer.","errors":["Foot remains extended: “Return the free foot before continuing.”","Weight arrives too early: “Replace first; transfer only after the lead is clear.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Connect the slide to a prepared cross for progressing students."},{"time":"35–42 min","title":"Slide into cross","purpose":"Use the slide as a controlled pathway into the Week 1 cross.","leader":["Demonstrate a short inside slide into a small cross.","Pause before any weight transfer.","Offer slide-and-replace as the core alternative."],"follower":["Demonstrate preserving the standing axis during the cross.","Reinforce that the crossed position does not require immediate weight."],"task":["Core students slide and replace. Progressing students slide into a cross, pause, and recover."],"success":"The cross follows the existing free-leg path without increased force.","errors":["Force increases to complete the cross: “Stop where the natural pathway ends.”","Follower transfers automatically: “Crossing is a position before it becomes a step.”"],"safety":[],"rotation":"","transition":"Practise entries from a prepared cross and open parallel position."},{"time":"42–48 min","title":"Entry and exit choices","purpose":"Make slides available from more than one social position.","leader":["Demonstrate entry from open parallel position and a prepared cross.","Show exits to neutral and Basic 3.","Require a complete reset between actions."],"follower":["Demonstrate remaining available without presenting the leg.","Observe anticipation and hidden weight changes."],"task":["Choose one entry, one slide direction, and one recovery. Repeat with reduced range after changing partner."],"success":"Couples retain control when the setup changes.","errors":[],"safety":[],"rotation":"","transition":"Introduce range adaptation and partner feedback."},{"time":"48–53 min","title":"Range and alignment adaptation","purpose":"Teach students to calibrate rather than impose a standard slide size.","leader":["Ask leaders to begin with the smallest possible action.","Increase range only while contact remains light and alignment remains clear.","Reinforce cancelling the action when the partner's structure changes."],"follower":["Explain nonverbal resistance and verbal opt-out.","Encourage followers to maintain their own comfortable endpoint."],"task":["Repeat the same slide with two different partners, starting smaller each time and stopping at the first change in alignment."],"success":"Movement size changes appropriately between partners.","errors":[],"safety":[],"rotation":"Rotate once before final practice.","transition":"Set the social-dance constraint."},{"time":"53–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Stay low,” “Keep it light,” “Replace,” and “Recover.”","Stop any joint pressure or force immediately."],"follower":["Observe standing-side stability and partner adaptation.","Join temporarily if roles are uneven."],"task":[],"success":"Most slides are small, optional, and followed by a clean recovery.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 3 connection","purpose":"","leader":["Recap prepare, align, slide, release, replace, recover.","Explain that Week 3 uses the same free-leg preparation for a small lift."],"follower":["Reinforce that active follower balance remains essential.","Ask which direction felt more natural and why."],"task":["Identify their comfortable range and the signal that tells them to stop."],"success":"Students understand that alignment and partner range determine the movement size.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w3","level":2,"week":3,"title":"Leg Lifts","status":"Draft — Test in class","promise":"By the end of the class, students will be able to guide one small prepared free-leg lift, replace the foot safely, and recover into social flow while both partners remain independently balanced.","movement":["Lift preparation","Small inside lift","Lift and replace","Lift into cross","Entry from open parallel position","Exit through replacement and walk"],"foundation":["Stop and identify the free leg first.","Establish the standing axis before changing height.","Guide the pathway from close to the floor.","Keep the lift below the partner's comfortable range.","The follower remains active and balanced; no jumping.","Replace the free foot before continuing unless a clear cross is prepared."],"prerequisites":["Students should demonstrate light slide contact, free-leg recognition, stable open connection, and the ability to replace the foot without an accidental transfer."],"core":["Prepared stop","Small inside lift","Lift and replace","Walk out"],"progressing":["Lift into cross","Entry from Follower Saída","Adapt range to a new partner"],"challenge":["Syncopated lift after stable preparation","Lift into pivot preparation","Alternative controlled exit"],"entries":[],"exits":[],"social":[],"errors":["Trying to lift body weight: “Guide the free leg, not the person.”","Hooking behind the knee: “Keep contact low and away from joints.”","Follower jumping: “Stay grounded; only the free leg moves.”","Lift exceeds axis control: “Reduce height before balance changes.”","Foot drops on replacement: “Control the way down.”","Weight transfers too early: “Replace first; transfer second.”"],"safety":["Every lift is optional.","The leader never lifts or supports the follower's body weight.","No hooking behind the knee or pressure on joints.","Range stays below the partner's comfortable limit.","Stop immediately when resistance, pain, fear, or axis loss appears.","Followers may choose slide-only or no-contact participation.","Teachers explain corrections before physical contact."],"questions":["Is the no-contact stage long enough?","Can the weakest admitted student replace the foot without an accidental transfer?","Does Follower Saída improve preparation or add overload?","Are students prioritising height over control?","Which musical accent supports a small lift without encouraging a kick?"],"previous":"Level 2, Week 2","next":"Level 2, Week 4","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 2 recap and readiness check","purpose":"Confirm that students can prepare, slide, replace, and recover before adding height.","leader":["Lead one inside slide and one slide-and-replace.","Observe range, contact, and weight clarity.","Restate that resistance or loss of axis cancels the next action."],"follower":["Demonstrate active standing-side control.","Identify students who should remain with no-contact or slide-only work."],"task":["Prepare a free leg, complete one small slide, replace, and return to Basic 3."],"success":"Most couples recover without dragging, leaning, or early weight transfer.","errors":[],"safety":[],"rotation":"","transition":"Separate and train standing-axis control individually."},{"time":"5–11 min","title":"Individual axis and free-leg height","purpose":"Find a safe personal lift range before partner guidance.","leader":["Guide students to stand on one leg and move the free foot slightly from the floor.","Demonstrate that height decreases when balance changes.","Emphasise soft knee and vertical axis."],"follower":["Demonstrate a tiny lift, pause, and controlled replacement.","Observe locked knees, hip collapse, and hopping."],"task":["Prepare the free leg, lift it only a few centimetres, pause, replace it quietly, and repeat on the other side."],"success":"Students lift and replace without jumping, gripping the floor, or changing the standing foot.","errors":["Jumping: “The standing leg stays; only the free leg moves.”","Lift becomes high: “Stop before your axis changes.”","Foot drops: “Control the replacement as carefully as the lift.”"],"safety":[],"rotation":"","transition":"Form partners and communicate the lift pathway without leg contact."},{"time":"11–17 min","title":"No-contact lift preparation","purpose":"Establish shared timing and consent before physical guidance.","leader":["Demonstrate a prepared stop from open parallel position.","Indicate the lift through body direction and frame without touching the leg.","Pause and return to neutral."],"follower":["Explain how the follower recognises preparation while maintaining personal axis.","Demonstrate remaining grounded instead of jumping to create the effect."],"task":["Leaders prepare and indicate a small lift. Followers move the free leg within their own range, replace, and recover."],"success":"Couples agree on timing without verbal planning or leg-to-leg contact.","errors":[],"safety":[],"rotation":"Rotate once.","transition":"Add low contact for the inside lift."},{"time":"17–24 min","title":"Small inside lift","purpose":"Teach the core lift with minimal height and maximum control.","leader":["Demonstrate stop, free-leg check, low contact, small upward pathway, and immediate release.","Show that the leader's structure remains upright and does not scoop the partner.","Contrast guiding the free leg with trying to lift the follower."],"follower":["Demonstrate stable standing-side support.","Explain that the follower follows the pathway actively and never jumps.","Show the right to reduce or stop the range."],"task":["Prepare one small inside lift, pause briefly, release, replace the foot, and return to Basic 3."],"success":"The follower's body height and standing axis remain stable while only the free leg changes level.","errors":["Leader tries to lift body weight: “Guide the free leg; never lift the person.”","Contact hooks behind the knee: “Keep contact low and away from the joint.”","Follower jumps: “Stay grounded and let only the free leg respond.”"],"safety":[],"rotation":"","transition":"Focus on controlled replacement."},{"time":"24–30 min","title":"Lift and replace","purpose":"Make recovery as intentional as the lift.","leader":["Demonstrate lowering the free leg to the floor before inviting any transfer.","Show replacement into neutral and replacement into a walking line.","Observe leaders who release too early."],"follower":["Demonstrate controlling the descent rather than dropping the foot.","Reinforce waiting for the transfer invitation."],"task":["Lift, pause, replace quietly, confirm balance, and walk out."],"success":"The foot returns under control and the next step begins only after both partners are stable.","errors":["Foot drops: “Lower with control; do not release the leg suddenly.”","Weight transfers on landing: “Replace first, then receive the next direction.”","Leader holds the leg: “Guide and release; never trap.”"],"safety":[],"rotation":"","transition":"Use the controlled replacement pathway to create a cross."},{"time":"30–37 min","title":"Lift into cross","purpose":"Connect the lift to Week 1 crossing without increasing force.","leader":["Demonstrate a small lift followed by a guided cross.","Pause before weight transfer.","Offer lift-and-replace as the core alternative."],"follower":["Demonstrate maintaining the standing axis while the free leg crosses.","Reinforce that the cross position does not require immediate weight."],"task":["Core students lift and replace. Progressing students lift, guide into a small cross, pause, and recover."],"success":"The cross follows naturally from the free-leg pathway without pulling the torso or increasing height.","errors":["Lift and cross merge too quickly: “Complete the lift before changing direction.”","Follower transfers automatically: “Cross first; weight only when invited.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Practise entries and exits with a new partner."},{"time":"37–43 min","title":"Entry from open parallel position","purpose":"Create a repeatable social entry with clear preparation.","leader":["Demonstrate open parallel alignment, prepared stop, small lift, replace, and walk.","Reinforce reducing range after every partner rotation."],"follower":["Demonstrate waiting without presenting the leg.","Observe anticipation and bracing."],"task":["Use the complete core sequence once, then return to social vocabulary before repeating."],"success":"Couples complete the action without verbal planning and return immediately to walking.","errors":[],"safety":[],"rotation":"","transition":"Add the Follower Saída entry for stable couples."},{"time":"43–48 min","title":"Follower Saída entry and controlled exit","purpose":"Apply the lift inside an existing pathway without turning the class into choreography.","leader":["Demonstrate a compact Follower Saída, settle the free leg, create one small lift, and exit through replacement.","Keep open-parallel entry available as the core version."],"follower":["Show how to complete the Saída before the lift preparation.","Observe lifts attempted before weight becomes clear."],"task":["Choose open-parallel or Follower Saída entry, complete one lift, and exit through walking or a cross."],"success":"The lift happens after a complete preparation, not during an unfinished Saída step.","errors":[],"safety":[],"rotation":"","transition":"Train restraint and partner adaptation."},{"time":"48–53 min","title":"Range calibration and selection","purpose":"Teach that lifts are occasional, partner-specific choices.","leader":["Ask leaders to begin with the smallest possible lift.","Permit one lift per phrase only when axis and free-leg status are clear.","Require a slide or no action when preparation is uncertain."],"follower":["Reinforce nonverbal resistance, verbal opt-out, and active balance.","Observe whether followers feel pressured to produce height."],"task":["Dance mainly with social vocabulary and use at most one prepared lift per phrase."],"success":"Students choose fewer, smaller lifts and adapt range after changing partner.","errors":[],"safety":[],"rotation":"Rotate once before final practice.","transition":"Set the independent social task."},{"time":"53–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Free leg,” “Small range,” “Replace,” and “Recover.”","Stop any hooking, jumping, or attempt to carry weight."],"follower":["Observe axis, consent, and controlled replacement.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples use isolated, low-range lifts and recover without loss of balance.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 4 connection","purpose":"","leader":["Recap prepare, guide, pause, replace, recover.","Explain that Week 4 uses completed crosses and free-leg control to introduce pivots and hook preparation."],"follower":["Reinforce that followers never jump or surrender body weight.","Ask which preparation gave the clearest sense of safety."],"task":["State the difference between guiding a free leg and lifting a partner."],"success":"Students understand that height is optional and control is mandatory.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w4","level":2,"week":4,"title":"Pivots, Hooks, and Rotations","status":"Draft — Test in class","promise":"By the end of the class, students will be able to complete controlled quarter and half pivots, connect one pivot to a leg cross, and return to walking while protecting each partner's axis and knees.","movement":["Individual pivot mechanics","Partner quarter pivot","Partner half pivot","Pivot into leg cross","Entry from a completed cross or open line","Exit to walking or compact circle"],"foundation":["Complete the current transfer before rotating.","Release and reorganise the feet as the body turns.","Keep knees aligned with toes.","Maintain individual axis and responsive connection.","The follower completes the current rotation before receiving a new direction.","A hook requires a genuinely free leg and remains optional."],"prerequisites":["Students should demonstrate controlled quarter turns, stable lift-and-replace, clear free-leg recognition, and an open-position frame that does not depend on arm force."],"core":["Quarter pivot","Two connected quarter turns as a half-pivot option","Return to walking"],"progressing":["Smooth half pivot","Pivot into leg cross","Entry from completed cross","Exit to compact circle"],"challenge":["Minimal lift into hook preparation","Travelling pivot with clear floor space","Reverse rotational exit","Suspension preparation after completed recovery"],"entries":[],"exits":[],"social":[],"errors":["Twisting a planted foot: “Release the foot before rotating.”","Turning through the arms: “Lead the pathway, not the shoulders.”","Hook without free-leg preparation: “No hook until rotation and weight are complete.”","Follower overrotates: “Complete only the direction that is available.”","Cross begins during pivot: “Finish rotation before leg action.”","Momentum prevents recovery: “Reduce speed and return to walking.”"],"safety":["No forced hooks or joint pressure.","Keep knees aligned with toes.","Reduce the rotation immediately when either partner loses axis.","Hook preparation is optional and may be replaced with a simple cross.","No one uses the partner for balance.","Teachers explain corrections before physical contact."],"questions":["Is the half pivot achievable for the weakest admitted student?","Does teaching two quarter turns produce better mechanics than one half pivot?","Can students separate rotation from leg action?","Does hook preparation add value or overload the class?","Which music supports control without encouraging spinning?"],"previous":"Level 2, Week 3","next":"Level 2, Week 5","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 3 recap and rotational readiness","purpose":"Confirm free-leg control and balanced recovery before adding pivots.","leader":["Lead a small lift-and-replace and lift-into-cross recap.","Observe standing axis and whether students twist during the cross.","Introduce the class promise and knee-safety rule."],"follower":["Demonstrate controlled replacement and stable open frame.","Identify students who should remain with quarter pivots only."],"task":["Prepare a free leg, create one small cross, settle balance, and walk out."],"success":"Most students complete the cross without planted-foot twisting or loss of axis.","errors":[],"safety":[],"rotation":"","transition":"Separate and isolate pivot mechanics."},{"time":"5–11 min","title":"Individual pivot mechanics","purpose":"Teach safe rotation through the feet before partner connection.","leader":["Demonstrate a quarter pivot with released feet and organised posture.","Show the unsafe planted-foot twist.","Progress from quarter to half pivot only when balance remains clear."],"follower":["Demonstrate soft knees, toe-knee alignment, and controlled spotting of the new direction.","Observe hopping, locked knees, and upper-body-only turning."],"task":["Complete quarter pivots, pause in balance, then attempt a half pivot using small reorganising steps or a controlled swivel within comfort."],"success":"Students finish each rotation with stable weight and knees aligned over the feet.","errors":["Planted-foot twist: “Release the foot before changing orientation.”","Upper body turns alone: “Let the feet and body arrive together.”","Rotation exceeds balance: “Reduce the angle before adding speed.”"],"safety":[],"rotation":"","transition":"Form partners and communicate one quarter pivot without leg action."},{"time":"11–17 min","title":"Partner rotation preparation","purpose":"Establish shared timing without arm-led turning.","leader":["Demonstrate preparation from an open line.","Create a small rotational invitation through the centre and pathway.","Stop after one quarter turn.","Show the incorrect hand-driven version."],"follower":["Explain receiving rotation while maintaining personal axis.","Demonstrate completing the turn before accepting a new direction.","Observe anticipation and leaning."],"task":["Leaders prepare one quarter turn. Followers complete it independently. Both pause and return to neutral."],"success":"Couples rotate without pulling the arms or using the partner for balance.","errors":[],"safety":[],"rotation":"Rotate once.","transition":"Build the complete quarter pivot from the new partnership."},{"time":"17–24 min","title":"Quarter pivot","purpose":"Teach the core rotational unit with clear entry and recovery.","leader":["Demonstrate entry from open line and completed cross.","Show quarter pivot, balance check, and walk out.","Observe movement size and arm tension."],"follower":["Demonstrate foot release and stable axis.","Reinforce that the follower does not add extra rotation.","Observe knees turning away from toes."],"task":["Enter, complete one quarter pivot, settle, and return to walking or Basic 3."],"success":"Most couples complete the quarter pivot and recover without correction steps.","errors":["Leader turns through the arms: “Lead the pathway; do not rotate the shoulders.”","Follower adds rotation: “Complete only the direction that is available.”","Couple exits early: “Finish the turn before choosing the line.”"],"safety":[],"rotation":"","transition":"Extend the same mechanics into a half pivot."},{"time":"24–31 min","title":"Half pivot","purpose":"Increase rotation while preserving the same safety standard.","leader":["Demonstrate two connected quarter turns as the accessible half-pivot pathway.","Offer a smoother half pivot only to stable couples.","Emphasise that speed does not create clarity."],"follower":["Demonstrate maintaining axis through the midpoint.","Observe students who collapse, hop, or twist the standing knee."],"task":["Core students connect two quarter pivots. Progressing students complete one controlled half pivot, pause, and recover."],"success":"Students maintain balance and connection throughout the full change of orientation.","errors":["Momentum carries the student past the endpoint: “Reduce speed and finish the intended angle.”","Feet remain fixed: “Allow the base to reorganise.”","Frame becomes rigid: “Keep the connection responsive, not locked.”"],"safety":[],"rotation":"","transition":"Use a completed pivot to create a free-leg cross."},{"time":"31–38 min","title":"Pivot into leg cross","purpose":"Connect rotational control to the crossing vocabulary from Week 1.","leader":["Demonstrate quarter pivot, completed balance, free-leg recognition, and small cross.","Pause before weight transfer.","Show the unsafe version where the cross begins during rotation."],"follower":["Demonstrate completing the pivot before allowing the free leg to cross.","Observe planted-foot twisting and automatic transfer."],"task":["Pivot, settle, identify the free leg, guide one cross, and recover to walking."],"success":"The cross begins only after rotation is complete and the free leg is clear.","errors":["Cross starts too early: “Finish rotation before leg action.”","Follower transfers automatically: “Cross is a position before it becomes a step.”","Leader pulls the torso: “Guide the free-leg pathway after the axis settles.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Introduce optional hook preparation without completing a forced hook."},{"time":"38–44 min","title":"Hook preparation","purpose":"Clarify what makes a hook safe and why it is not compulsory.","leader":["Demonstrate a small lift or cross that produces a clearly free leg.","Show a minimal hook-shaped pathway without pressure behind the knee.","Emphasise immediate release and replacement.","Keep pivot-into-cross as the core alternative."],"follower":["Demonstrate active free-leg control and personal range.","Explain that followers do not wrap or clamp the leg.","Show the opt-out response: replace and walk."],"task":["Core students repeat pivot into cross. Progressing students explore a minimal hook preparation, release, replace, and recover."],"success":"No hook is forced, trapped, or used to support weight.","errors":[],"safety":[],"rotation":"","transition":"Connect entries and exits without adding further figures."},{"time":"44–49 min","title":"Entry and exit choices","purpose":"Make pivots adaptable to social flow.","leader":["Demonstrate entries from open line and completed cross.","Show exits to walking and a compact circle.","Require both partners to complete rotation before exit."],"follower":["Demonstrate following without predicting the exit.","Observe late recovery and overrotation."],"task":["Choose one entry, quarter or half pivot, optional cross, and one controlled exit."],"success":"Couples change direction without verbal planning or arm force.","errors":[],"safety":[],"rotation":"","transition":"Apply a one-sequence-per-phrase restraint rule."},{"time":"49–54 min","title":"Rotational selection drill","purpose":"Prevent continuous pivot combinations and prioritise recovery.","leader":["Ask leaders to use one pivot sequence per phrase, then return to walking.","Require a smaller version with each new partner.","Reinforce cancelling rotation when floor space is unclear."],"follower":["Observe axis, anticipation, and partner-specific range.","Reinforce returning to neutral after any missed lead."],"task":["Dance mainly with walking vocabulary and insert one controlled pivot sequence per phrase."],"success":"Students spend more time in social flow than in rotational setup.","errors":[],"safety":[],"rotation":"Rotate once before final practice.","transition":"Set the independent task."},{"time":"54–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Release the foot,” “Complete,” “Recover,” and “Walk.”","Stop any forced hook or planted-knee twist immediately."],"follower":["Observe individual axis and completion of rotation.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples complete a compact pivot and recover without carrying momentum into the next action.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 5 connection","purpose":"","leader":["Recap prepare, pivot, complete, optional cross, recover.","Explain that Week 5 uses controlled stops and completed pivots to explore suspension and release."],"follower":["Reinforce knee alignment and personal axis.","Ask whether quarter or half pivot produced better control."],"task":["Identify the condition that must exist before a hook or cross: completed rotation and a clear free leg."],"success":"Students understand that smaller controlled rotation is preferable to forced range.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w5","level":2,"week":5,"title":"Suspension and Release","status":"Draft — Test in class","promise":"By the end of the class, students will be able to create a brief suspended feeling through delayed transfer, compression, and release while both partners remain able to return to their own axis independently.","movement":["Individual delayed transfer","Delayed forward transfer","Delayed backward transfer","Compression and release","Return to individual axis","Walk-out recovery","Musical hold and release"],"foundation":["Prepare before delaying or inclining.","Both partners retain muscular structure and personal responsibility.","Compression is responsive, not forceful.","A hold pauses transfer; it does not remove the pulse.","Release returns both partners to their own axis.","Inclination stays small enough for either partner to recover independently."],"prerequisites":["Students should demonstrate controlled stopping, stable open connection, completed pivot recovery, and the ability to maintain posture without hanging on the partner."],"core":["Individual delayed transfer","Delayed forward transfer","Compression and release","Return to axis and walk out"],"progressing":["Delayed backward transfer","Entry from completed pivot","Musical hold and release"],"challenge":["Small supported inclination with explicit consent","Suspension into a completed pivot","Two-pulse hold with controlled release"],"entries":[],"exits":[],"social":[],"errors":["Leaning before preparation: “Prepare the timing before changing the shape.”","Hanging body weight: “Keep enough structure to recover alone.”","Frame collapses: “Responsive tone, not softness without support.”","Release becomes a shove: “Reduce pressure before continuing.”","Breath is held: “Breathe through the suspension.”","Couple continues before axis returns: “Own your balance before the next step.”"],"safety":["No deep dips, backbends, or surprise inclinations.","Both partners remain able to recover independently.","Inclination is optional and requires explicit agreement.","Avoid inclination with unresolved back, knee, neck, balance, or trust concerns.","No hanging from arms or collapsing the frame.","Teachers explain corrections before physical contact."],"questions":["Is backward suspension appropriate as core material?","Do students understand pulse continuing beneath the hold?","Is explicit verbal consent needed before every inclination practice?","Can the weakest admitted student recover independently?","Which musical texture encourages suspension without rigidity?"],"previous":"Level 2, Week 4","next":"Level 2, Week 6","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 4 recovery recap","purpose":"Confirm that students can stop after rotation and recover to neutral before adding suspension.","leader":["Lead quarter pivot, complete stop, and walk-out recovery.","Observe whether students carry momentum or use the partner for balance.","Introduce the class promise and no-dip boundary."],"follower":["Demonstrate completed rotational recovery and independent axis.","Identify students who should practise delayed transfer without inclination."],"task":["Pivot, stop, settle on individual axes, and walk out together."],"success":"Most couples recover without leaning, correction steps, or arm tension.","errors":[],"safety":[],"rotation":"","transition":"Separate and explore delayed transfer individually."},{"time":"5–11 min","title":"Individual delayed transfer","purpose":"Teach suspension timing without partner support.","leader":["Demonstrate stepping toward a transfer, delaying briefly, then completing it.","Keep the standing leg active and posture organised.","Show the difference between delay and freezing rigidly."],"follower":["Demonstrate breath, soft knees, and controlled release.","Observe locked joints, collapsed torso, and loss of pulse."],"task":["Approach a transfer, hold for one pulse while balanced, then complete the step and continue walking."],"success":"Students delay and release without hopping or falling onto the receiving foot.","errors":["Body freezes: “Keep the pulse alive even when transfer waits.”","Standing leg collapses: “Support yourself before releasing.”","Breath is held: “Breathe through the delay.”"],"safety":[],"rotation":"","transition":"Form partners and establish responsive compression without travel."},{"time":"11–17 min","title":"Connection and compression drill","purpose":"Create elastic connection without pushing or hanging.","leader":["Demonstrate open connection with small compression through the frame.","Show immediate release to neutral.","Contrast responsive tone with rigid pushing."],"follower":["Explain receiving and matching pressure without surrendering axis.","Demonstrate the opt-out response: reduce tone and return to neutral.","Observe leaning and locked elbows."],"task":["Create a small shared compression, hold briefly, release, and repeat without stepping."],"success":"Both partners remain upright and can release without an adjustment step.","errors":["Pushing through arms: “Use whole-body organisation, not hand force.”","Partner hangs: “Keep your own axis while matching connection.”","Frame locks: “Responsive, not rigid.”"],"safety":[],"rotation":"Rotate once.","transition":"Add a delayed forward transfer."},{"time":"17–24 min","title":"Delayed forward transfer","purpose":"Apply suspension timing to a clear directional movement.","leader":["Demonstrate preparation, small forward intention, delayed transfer, and completion.","Keep the action within both partners' balance range.","Show release into walking."],"follower":["Demonstrate receiving direction while delaying weight transfer.","Reinforce keeping the standing foot active until release.","Observe followers who step early or lean backward."],"task":["Prepare, approach the forward transfer, delay for one pulse, complete together, and walk out."],"success":"Couples share the delay without pulling, bracing, or arriving on different timings.","errors":["Follower transfers early: “Keep the standing side until the release arrives.”","Leader increases force during delay: “Hold the timing, not the partner.”","Couple loses pulse: “Hear the beat underneath the suspension.”"],"safety":[],"rotation":"","transition":"Repeat with the opposite directional relationship."},{"time":"24–31 min","title":"Delayed backward transfer","purpose":"Develop control when the receiving direction feels less secure.","leader":["Demonstrate a small backward invitation with clear preparation.","Keep the pathway short and avoid pulling.","Show recovery to neutral before walking."],"follower":["Demonstrate maintaining posture and compact step range.","Observe reaching, leaning, or collapsing through the back."],"task":["Prepare a backward transfer, delay briefly, complete it within a small range, return to axis, and walk out."],"success":"Both partners complete the action without reaching beyond their base or hanging on the connection.","errors":["Step reaches too far: “Keep the receiving foot close enough to own your balance.”","Upper body falls away: “Delay within your axis, not outside it.”","Leader pulls: “Prepare through direction and wait for response.”"],"safety":[],"rotation":"","transition":"Combine delayed transfer with compression and release."},{"time":"31–38 min","title":"Compression and release in motion","purpose":"Create a complete suspension unit with an explicit recovery point.","leader":["Demonstrate approach, compression, one-pulse hold, release, and completion.","Mark the moment both partners return to individual axis.","Observe whether release becomes a shove."],"follower":["Demonstrate matching compression while maintaining personal structure.","Reinforce controlled return rather than being projected away."],"task":["Enter from open line, create one small compression, hold, release to axis, and continue walking."],"success":"The release is quiet and both partners recover without extra steps.","errors":["Release becomes sudden: “Reduce pressure before continuing.”","Partners remain dependent: “Return to your own axis before the next step.”","Frame collapses: “Keep structure without locking.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Apply the sequence after a completed pivot."},{"time":"38–44 min","title":"Entry from completed pivot and walk-out","purpose":"Connect Week 4 recovery to the new timing without creating a long combination.","leader":["Demonstrate quarter pivot, complete recovery, delayed transfer, release, and walk-out.","Keep open-line entry available as the core version."],"follower":["Demonstrate finishing the pivot before the suspension preparation begins.","Observe students combining actions before balance is restored."],"task":["Choose open-line or completed-pivot entry, create one suspension, recover to axis, and walk out."],"success":"Suspension begins only after the preceding movement is complete.","errors":[],"safety":[],"rotation":"","transition":"Connect the hold to musical phrasing."},{"time":"44–49 min","title":"Musical hold and release","purpose":"Use suspension as interpretation rather than a repeated trick.","leader":["Play a track with clear pauses or sustained moments.","Demonstrate dancing through ordinary beats and suspending only on a clear musical opportunity.","Limit the hold to one or two pulses."],"follower":["Demonstrate listening through the hold rather than predicting release.","Observe breath-holding and rigidity."],"task":["Dance continuously and use one prepared suspension on a clear musical hold, then recover immediately."],"success":"Students choose fewer suspensions and place them intentionally.","errors":[],"safety":[],"rotation":"","transition":"Offer a small inclination only to stable, consenting couples."},{"time":"49–54 min","title":"Optional small inclination","purpose":"Clarify the safe limit of supported shape without teaching a dip.","leader":["Demonstrate explicit preparation and a very small shared inclination.","Keep both feet grounded and both bodies capable of independent recovery.","Show the unsafe deep or surprise version."],"follower":["Explain consent, range control, and the right to stay vertical.","Demonstrate returning to axis before any exit."],"task":["Core students repeat compression and release vertically. Progressing students, after agreement, explore a minimal inclination and return to axis."],"success":"No partner becomes dependent on the other or moves beyond a self-recoverable range.","errors":[],"safety":[],"rotation":"Rotate once before final practice; inclination does not carry automatically to the new partner.","transition":"State the final task and require fresh consent after rotation."},{"time":"54–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Delay,” “Breathe,” “Release,” and “Recover.”","Stop any surprise lean, hanging, or deep range immediately."],"follower":["Observe personal structure, consent, and recovery.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples suspend briefly, release quietly, and return to social flow.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 6 connection","purpose":"","leader":["Recap prepare, delay, compress, release, own axis, walk out.","Explain that Week 6 extends shared timing into small counterbalance foundations."],"follower":["Reinforce the right to remain vertical and the need to breathe.","Ask which recovery cue felt most reliable."],"task":["Identify the non-negotiable recovery point: both partners back on their own axes."],"success":"Students understand that suspension is controlled timing, not dropping or dipping.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w6","level":2,"week":6,"title":"Counterbalance Foundations","status":"Draft — Test in class","promise":"By the end of the class, students will be able to prepare, enter, hold, and recover from a small static or linear counterbalance while each partner maintains structure and remains able to return to individual axis.","movement":["Counterbalance readiness and consent","Static two-person counterbalance","Small linear counterbalance","Shared hold and recovery","Entry from open line or suspension","Exit to individual axis and Basic 3"],"foundation":["Prepare and agree before entering.","Both partners carry their own muscular structure.","Keep the body line organised rather than bending at the waist.","Use small compatible distance.","Enter and recover on shared timing.","Hands and arms communicate; they do not suspend body weight.","Return fully to individual axis before continuing."],"prerequisites":["Students should demonstrate controlled suspension and release, stable open frame, independent recovery, and the ability to maintain posture without hanging or locking the arms."],"core":["Readiness and consent","Static counterbalance","Shared recovery","Exit to Basic 3"],"progressing":["Linear counterbalance","Entry from completed suspension","Adapt distance to a new partner"],"challenge":["Small side counterbalance","Counterbalance into walking","Minor distance change while maintaining structure"],"entries":[],"exits":[],"social":[],"errors":["Dropping body weight: “Enter gradually and carry your own structure.”","Bending from lower back: “Keep the body line organised and reduce range.”","Locked arms: “Use responsive elbows, not a rigid grip.”","Unequal distance: “Match the smaller shared range.”","Late recovery: “Return before the frame weakens.”","Walking before axis returns: “Own your balance first.”"],"safety":["No surprise counterbalances.","Each new partner requires fresh agreement and distance calibration.","Both partners carry their own structure and must be able to recover independently.","Avoid deep ranges and lower-back bending.","Do not use counterbalance with unresolved back, knee, balance, or trust concerns.","Teachers explain corrections before physical contact."],"questions":["Can the weakest admitted student return independently every time?","Is the linear version too early for the first counterbalance class?","Do students seek fresh agreement after rotation?","Does side counterbalance add value or unnecessary risk?","Which musical texture supports shared timing without encouraging long holds?"],"previous":"Level 2, Week 5","next":"Level 2, Week 7","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 5 recap and readiness check","purpose":"Confirm suspension, release, and independent recovery before counterbalance.","leader":["Lead delayed transfer, compression, release, and walk-out.","Observe hanging, locked arms, and late recovery.","State that counterbalance is optional and requires preparation."],"follower":["Demonstrate vertical structure and return to personal axis.","Identify students who should practise timing and connection without inclination."],"task":["Create one small compression and release, then separate into individual balance."],"success":"Most couples can release without adjustment steps or dependency.","errors":[],"safety":[],"rotation":"","transition":"Separate and train body structure individually."},{"time":"5–11 min","title":"Individual structure and recovery line","purpose":"Teach the body organisation needed before sharing counterbalance.","leader":["Demonstrate a tall organised line with soft knees and active trunk.","Show a tiny whole-body inclination from the ankles versus bending from the lower back.","Demonstrate immediate return to vertical."],"follower":["Demonstrate the same action from the side.","Observe lower-back collapse, locked knees, and head displacement."],"task":["Maintain an organised line, create a minimal ankle-led inclination, return to vertical, and confirm balance without using the arms."],"success":"Students can return to vertical independently and without stepping.","errors":["Bending at the waist: “Keep the body line organised and reduce the range.”","Knees lock: “Keep the legs active, not rigid.”","Return requires a step: “Make the inclination smaller.”"],"safety":[],"rotation":"","transition":"Form partners and calibrate distance and consent without leaning."},{"time":"11–17 min","title":"Partner preparation, consent, and distance","purpose":"Create a safe shared setup before any counterbalance.","leader":["Demonstrate explicit preparation and a verbal or clearly agreed opt-in.","Show open-frame distance that allows both partners to remain vertical.","Introduce the sequence: prepare, enter, hold, recover."],"follower":["Demonstrate accepting, reducing, or declining the action.","Explain that a new partner means a new calibration.","Observe arm locking and unequal distance."],"task":["Agree on participation, establish distance, create gentle connection, and practise the entry signal without changing body angle."],"success":"Partners can communicate readiness and cancel the action without awkwardness.","errors":["Entry begins without agreement: “Prepare and receive a clear response first.”","Distance is too large: “Move closer before creating load.”","Arms lock: “Keep the elbows responsive.”"],"safety":[],"rotation":"Rotate once and recalibrate from zero.","transition":"Add a minimal static counterbalance."},{"time":"17–24 min","title":"Static counterbalance","purpose":"Teach the core shape with almost no travel.","leader":["Demonstrate shared preparation, tiny opposing inclination, one-pulse hold, and recovery.","Keep the range small enough that either partner could return alone.","Show the unsafe drop-and-catch version."],"follower":["Demonstrate active body structure and equal timing.","Reinforce that the follower does not hang or soften into the arms.","Observe asymmetrical range."],"task":["Prepare, enter a minimal static counterbalance, hold for one pulse, recover together, and release connection."],"success":"Both partners maintain organised structure and recover without pulling or stepping.","errors":["One partner drops: “Enter gradually and carry your own structure.”","Unequal range: “Match the smaller partner's distance.”","Arms carry weight: “Reduce range until the body—not the grip—creates stability.”"],"safety":[],"rotation":"","transition":"Add a small linear pathway."},{"time":"24–31 min","title":"Linear counterbalance","purpose":"Introduce controlled movement into and out of counterbalance.","leader":["Demonstrate a small linear step away, shared structure, and return.","Keep the movement symmetrical and close to neutral.","Mark the recovery point clearly."],"follower":["Demonstrate matching timing without increasing range.","Observe delayed entry or one partner travelling farther."],"task":["Prepare, take one small compatible step into linear counterbalance, hold briefly, return together, and regain individual axis."],"success":"Partners move and recover on shared timing without sudden load.","errors":["One partner moves first: “Enter together after preparation.”","Distance grows unexpectedly: “Use one small step and stop.”","Recovery is late: “Return before the frame weakens.”"],"safety":[],"rotation":"","transition":"Isolate the recovery process."},{"time":"31–38 min","title":"Recovery and release","purpose":"Make the exit the most reliable part of the action.","leader":["Demonstrate reducing counterbalance, returning to vertical, confirming individual axis, then releasing the frame.","Show why walking out before recovery is unsafe."],"follower":["Demonstrate maintaining structure through the entire return.","Observe partners who collapse once the hold ends."],"task":["Enter a small static or linear counterbalance, recover fully to individual axes, pause, then walk out together."],"success":"Every couple visibly returns to neutral before taking the next step.","errors":["Walking begins too soon: “Own your axis before moving.”","Frame releases during recovery: “Maintain communication until both are vertical.”","Partner is pulled inward: “Reduce the shared angle before stepping.”"],"safety":[],"rotation":"Rotate at the end of the section and restart with readiness calibration.","transition":"Connect the action to Week 5 suspension."},{"time":"38–44 min","title":"Entry from suspension","purpose":"Use a familiar prepared hold as a controlled entry without creating surprise load.","leader":["Demonstrate delayed transfer, return to a stable open line, explicit counterbalance preparation, small entry, and recovery.","Keep direct open-line entry available as the core version."],"follower":["Demonstrate distinguishing suspension from counterbalance preparation.","Observe actions that blend before the first recovery is complete."],"task":["Choose direct open-line entry or completed suspension entry, create one small counterbalance, recover, and walk out."],"success":"Counterbalance begins only after the prior movement is fully resolved.","errors":[],"safety":[],"rotation":"","transition":"Practise the Basic 3 exit and social recovery."},{"time":"44–49 min","title":"Exit to Basic 3","purpose":"Return advanced content to recognisable social flow.","leader":["Demonstrate full recovery, release into a clear direction, and Basic 3.","Reinforce that the exit does not use stored tension to throw the partner."],"follower":["Demonstrate waiting for the new direction after axis returns.","Observe anticipatory steps and rebound."],"task":["Recover from counterbalance, settle into neutral, and enter Basic 3 without rebound or pulling."],"success":"Couples transition quietly into Basic 3 with normal step size.","errors":[],"safety":[],"rotation":"","transition":"Offer a side variation only to stable couples."},{"time":"49–54 min","title":"Optional side counterbalance","purpose":"Preview a new direction while preserving the same structure and recovery rules.","leader":["Demonstrate a very small side-oriented counterbalance.","Keep feet under control and range minimal.","Retain static or linear versions as the core task."],"follower":["Demonstrate side-body organisation without collapsing the waist.","Reinforce the right to decline or remain with the core version."],"task":["Core students repeat static and linear versions. Progressing students, after agreement, explore one small side counterbalance and recover."],"success":"Side range remains self-recoverable and does not twist knees or spine.","errors":[],"safety":[],"rotation":"Rotate once before final practice; obtain fresh agreement.","transition":"Set the final social task."},{"time":"54–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Small range,” “Hold,” “Recover,” and “Own your axis.”","Stop any dropping, lower-back bending, or locked-arm loading immediately."],"follower":["Observe consent, structure, equal timing, and recovery.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples use one controlled counterbalance and recover without dependent weight or abrupt rebound.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 7 connection","purpose":"","leader":["Recap agree, prepare, enter, hold, recover, release.","Explain that Week 7 adds direction change and leg action only
