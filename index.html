const programme=[{"id":"open-night","level":0,"label":"Open Night","name":"Open Night","descriptor":"A 60-minute first Kizomba experience.","readiness":"Complete beginners welcome.","lessons":[{"id":"open-night","level":0,"week":0,"title":"Kizomba Open Night","status":"Draft","promise":"By the end of the class, students will have danced a short social Kizomba using walking, Basic 1, Basic 2, one simple rotation, and one timing choice.","movement":["Natural walking","Basic 2","Basic 1","Quarter-turn","Timing contrast"],"foundation":["Pulse","Complete weight transfer","Personal balance","Light connection"],"prerequisites":["Complete beginners welcome"],"core":[],"progressing":[],"challenge":[],"entries":[],"exits":[],"social":[],"errors":["Partial weight transfer","Steps becoming too large","Pulling through the arms","Followers anticipating","Leaders changing movement too quickly","Students losing the pulse during rotation","Students leaning during closer connection"],"safety":["Closer connection remains optional.","Open hold remains valid throughout.","Each student maintains personal balance.","Teachers do not force body position.","Students may decline any partner or connection distance.","Rotations must preserve personal space."],"questions":["Does Basic 2 first create faster engagement than Basic 1 first?","Is the quarter-turn achievable within the available time?","Does the timing game add value or create overload?","How many partner rotations feel appropriate?","Does the final independent dance need more time?","Which music transition produces the clearest emotional contrast?"],"previous":"Standalone introduction","next":"Level 1, Week 1","detailed":true,"sequence":[{"time":"0–4 min","title":"Welcome","purpose":"Explain the class journey. Reduce anxiety. Set consent and partner-rotation expectations.","leader":["Explain that the class moves from playful energy into slower connection.","State that open hold remains valid throughout.","State that closer connection is optional.","Explain that partners will rotate."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Listen, choose a preferred connection distance, and prepare to move."],"success":"Students understand the class goal and feel safe joining the first exercise.","errors":[],"safety":[],"rotation":"Explain that partners will rotate.","transition":""},{"time":"4–10 min","title":"Pulse and walking","purpose":"Establish pulse, full weight transfer, and personal balance.","leader":["Guide pulse, walking forward, walking backward, walking on the spot, and small directional changes.","Keep technical explanation brief."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Step fully onto each foot and keep steps small."],"success":"Most students stay on the pulse and complete each weight transfer.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"10–18 min","title":"Basic 2 solo","purpose":"Give students a visible and energetic first movement.","leader":["Teach Basic 2 slowly.","Add music once the weight transfer is clear."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Maintain the pulse and move side to side with controlled steps."],"success":"Most students complete Basic 2 without tapping or leaving weight between both feet.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"18–24 min","title":"Basic 2 partner game","purpose":"Add social interaction before dance hold.","leader":["Place students facing a partner.","Ask them to move toward each other, high five or clap, then move away.","Rotate partners once."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Keep personal timing while noticing the partner."],"success":"Students meet in the middle without rushing or colliding.","errors":[],"safety":[],"rotation":"Rotate partners once.","transition":""},{"time":"24–31 min","title":"Basic 2 in open hold","purpose":"Introduce leading and following with light connection.","leader":["Show open hold.","Explain that leaders propose direction and followers complete their own step.","Correct pulling, leaning, and oversized steps."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Dance Basic 2 while keeping personal balance."],"success":"Couples move together without pulling through the arms.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"31–39 min","title":"Basic 1","purpose":"Shift from energetic movement into a grounded Kizomba feeling.","leader":["Change to slower music.","Teach Basic 1 solo, then in open hold.","Compare its feeling with Basic 2."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Complete the rhythm and stay close to the spot."],"success":"Most students maintain full weight transfer during Basic 1.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"39–45 min","title":"Basic 1 and Basic 2 choice","purpose":"Move from memorising steps into making dance decisions.","leader":["Ask leaders to choose Basic 1 or Basic 2.","Ask followers to complete each weight transfer and avoid guessing.","Stop adding new information."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Change between both movements without stopping."],"success":"Couples recover by returning to Basic 2 when unsure.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"45–50 min","title":"Simple quarter-turn","purpose":"Add direction without teaching full Vírgula.","leader":["Demonstrate one quarter-turn.","Keep the direction consistent across the room.","Place Basic 2 before and after the turn."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Complete one controlled rotation and return to Basic 2."],"success":"Couples rotate without losing balance or crowding nearby dancers.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"50–55 min","title":"Slower connection and timing contrast","purpose":"Create the strongest emotional and musical contrast of the class.","leader":["Change to slower music.","Invite students to choose open, medium, or comfortable closer hold.","Teach one timing game: slow, two quicker steps, return to slow."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Keep steps small, maintain balance, and change timing without adding a new figure."],"success":"Students stay on the pulse and respect their partner's connection choice.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"55–59 min","title":"Independent social dance","purpose":"Let students experience dancing without constant instruction.","leader":["Limit prompts to Basic 1, Basic 2, quarter-turn, and the timing choice.","Circulate and support quietly."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Dance using the available choices."],"success":"Most couples dance continuously for several minutes.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"59–60 min","title":"Closing and course invitation","purpose":"Connect the experience to Level 1.","leader":["Recap walking, timing, connection, direction, and musical choice.","Explain the next course step and enrolment route."],"follower":["Demonstrate the follower role from a clear second angle.","Observe balance, anticipation, comfort, and connection range."],"task":["Ask questions and decide whether to join Level 1."],"success":"Students understand what happens next.","errors":[],"safety":[],"rotation":"","transition":""}]}]},{"id":"level-1","level":1,"name":"Foundations and Social Flow","descriptor":"Build reliable movement, connection, and recovery.","readiness":"No previous Kizomba experience required.","lessons":[{"id":"l1w1","level":1,"week":1,"title":"Your First Kizomba Flow","status":"Draft — Test in class","promise":"By the end of the class, students will be able to dance a short Kizomba flow using Marca, Basic 2, and Basic 1 while staying grounded, balanced, and on the pulse.","movement":["Pulse","Complete weight transfer","Marca","Basic 2","Basic 1","Open partner connection","Transition from Marca into Basic 2","Transition from Marca into Basic 1","Return to Marca as the principal recovery"],"foundation":["Neutral standing posture","Soft knees without collapsing","Complete weight transfer","Stable personal axis","Small steps","Relaxed upper body","Light partner connection","Pulse before movement vocabulary"],"prerequisites":["No previous Kizomba experience is required.","Students only need to be able to stand and walk comfortably. Pulse recognition, posture, and complete weight transfer are taught during this class rather than treated as prerequisites."],"core":["Marca","Basic 2","Basic 1","Return to Marca after each movement","Teacher-led movement changes"],"progressing":["Enter Basic 2 from Marca.","Return to Marca.","Enter Basic 1 from Marca.","Change between the two basics after completing the transfer.","Adjust movement size to a new partner."],"challenge":["Pause briefly and restart without losing balance.","Change step size while preserving timing.","Change movement at a musical phrase.","Use fewer verbal cues.","Dance with a new partner and adapt immediately."],"entries":[],"exits":[],"social":[],"errors":[],"safety":["Open hold remains valid throughout.","Connection distance is chosen by the students.","No pulling, pushing, or leaning.","Both partners remain responsible for their own balance.","Students may decline any partner.","Teachers do not force students into body positions.","Movement remains small when floor space is limited.","Corrections should be explained verbally before physical contact."],"questions":["Does Basic 2 first create faster engagement and clearer continuity from Open Night?","Is six minutes enough for the final independent dance?","Do students need more time in partner connection before Basic 2?","Is Basic 1 understood more clearly after Basic 2?","Are three partner rotations appropriate?","Do students use Marca naturally as recovery?","Does the class remain accessible to students who missed Open Night?","Which demonstration angle works best for Basic 1?","Which section regularly exceeds its allocated time?"],"previous":"Open Night","next":"Level 1, Week 2","detailed":true,"sequence":[{"time":"0–4 min","title":"Welcome and class framing","purpose":"Set expectations, reduce anxiety, and explain how the class connects to Open Night and the rest of Level 1.","leader":["Welcome the students.","Explain the student-facing promise.","Clarify that students will learn three simple choices rather than one long routine.","Explain that returning to Marca is always a valid recovery.","State that partners will rotate."],"follower":["Stand where all students can see the follower role.","Reinforce that no previous experience is required.","Demonstrate a comfortable open connection beside the leader-role teacher."],"task":["Listen to the class goal and expectations.","Choose whether to begin as a leader or follower.","Prepare to move individually."],"success":"Students understand that mistakes are expected and that the class is focused on foundations rather than performance.","errors":[],"safety":["Open hold remains valid throughout.","Closer connection is not required.","Students may decline any partner or connection distance."],"rotation":"","transition":"The leader-role teacher asks everyone to spread out with enough room to step comfortably in every direction."},{"time":"4–10 min","title":"Pulse, posture, and complete weight transfer","purpose":"Establish the physical foundation for Marca, Basic 2, and Basic 1.","leader":["Demonstrate neutral standing posture.","Guide students through shifting weight from one foot to the other.","Progress from weight shifts into stepping on the spot.","Use brief freezes to test whether students know which foot holds their weight.","Emphasise finishing one transfer before beginning the next."],"follower":["Mirror the movement from a second viewing angle.","Watch for students keeping weight between both feet.","Quietly support students who are looking at their feet or losing balance."],"task":["Shift fully from foot to foot.","Lift the free foot briefly to confirm that the standing leg holds the weight.","Keep the knees relaxed and the upper body upright.","Follow the musical pulse without travelling."],"success":"Most students can stop and identify which foot holds their weight without correcting themselves.","errors":["Partial weight transfer: “Finish one foot before moving the other.”","Looking at the feet: “Keep your eyes at partner or horizon level.”","Bouncing vertically: “Transfer across the floor rather than up and down.”","Steps becoming too large: “Keep the movement underneath your body.”"],"safety":[],"rotation":"","transition":"Keep the same pulse and reduce the action into Marca."},{"time":"10–14 min","title":"Marca individually","purpose":"Introduce the movement students will use to begin, reset, and recover throughout the course.","leader":["Demonstrate Marca with music.","Show it again slowly without music.","Explain that Marca is not a waiting position; it is an active dance choice.","Demonstrate how to return to Marca after briefly losing the pulse."],"follower":["Demonstrate the follower role.","Show the difference between complete and incomplete weight transfer.","Observe posture and balance."],"task":["Dance Marca individually.","Keep the steps small.","Stop on request, identify the weighted foot, and restart.","Recover through Marca after an intentional mistake."],"success":"Most students can continue Marca without teacher counting and can restart after stopping.","errors":["Tapping without transferring weight: “Step onto the foot; do not only touch the floor.”","Rushing: “Let the pulse arrive before moving.”","Stiff upper body: “Relax the shoulders and allow the body to settle over the standing leg.”"],"safety":[],"rotation":"","transition":"Explain that Basic 2 is the first visible movement choice built from the same complete transfer."},{"time":"14–20 min","title":"Basic 2 individually","purpose":"Introduce a clear lateral movement that is easy for beginners to see, reproduce, and connect to the Open Night experience.","leader":["Demonstrate Basic 2 with music.","Teach the essential lateral version.","Show how it grows from Marca while preserving the same pulse and weight transfer.","Keep counting brief and return quickly to music."],"follower":["Demonstrate the follower role beside the leader-role teacher.","Observe students who widen the movement excessively.","Reinforce that both feet must complete their weight transfer."],"task":["Dance Basic 2 individually.","Keep the lateral range controlled.","Complete every transfer.","Return to Marca when unsure."],"success":"Most students can dance repeated Basic 2 cycles and return to Marca without stopping.","errors":["Steps becoming too wide: “Keep the movement smaller than you think you need.”","Feet closing without weight transfer: “Arrive fully before changing direction.”","Upper body moving after the feet: “Let the body travel with the standing foot.”"],"safety":[],"rotation":"","transition":"Alternate Marca and Basic 2 on the leader-role teacher’s verbal cue."},{"time":"20–26 min","title":"Basic 1 individually","purpose":"Shift from the visible lateral quality of Basic 2 into a more compact and grounded Kizomba feeling.","leader":["Demonstrate the complete Basic 1 with music.","Break down the essential version.","Compare its compact feeling with Basic 2.","Emphasise that posture, pulse, and full transfer remain unchanged."],"follower":["Demonstrate the follower role.","Show the movement from the students’ opposite viewing angle if necessary.","Observe whether students remain balanced and close to their own position."],"task":["Dance Basic 1 individually.","Maintain small controlled steps.","Complete every transfer.","Alternate between Basic 1 and Marca."],"success":"Most students complete repeated Basic 1 cycles without losing balance or leaving weight between both feet.","errors":["Moving too far: “Make the movement fit inside your own space.”","Skipping a transfer: “Do not move the free foot until the standing foot is complete.”","Becoming mechanical: “Keep the pulse continuous even when the shape changes.”"],"safety":[],"rotation":"","transition":"Ask students to find a partner and establish open hold."},{"time":"26–32 min","title":"Partner connection and Marca","purpose":"Introduce leading and following without adding a new movement.","leader":["Demonstrate open hold.","Explain that the leader proposes direction through body movement.","Explain that the follower completes their own step and maintains personal balance.","Demonstrate incorrect pulling and the corrected version.","Lead Marca slowly with the follower-role teacher."],"follower":["Explain the follower experience.","Demonstrate the difference between following and anticipating.","Show that the follower should not lean or give body weight to the leader.","Support students having difficulty recognising the lead."],"task":["Establish a comfortable open hold.","Dance Marca together.","Maintain personal balance.","Keep the arms responsive but not forceful.","Stop and restart together."],"success":"Couples can dance Marca together without pulling, pushing, or leaning.","errors":["Pulling with the arms: “Move your centre before moving your hands.”","Follower anticipating: “Complete the current step before responding to the next one.”","Both students leaning: “Stand independently and let the connection communicate rather than support.”"],"safety":[],"rotation":"Rotate once at the end of this section using one clearly indicated direction.","transition":"Keep the new partner and add Basic 2."},{"time":"32–39 min","title":"Basic 2 with a partner","purpose":"Apply Basic 2 through connection while preserving individual balance and controlled lateral space.","leader":["Demonstrate the entry from Marca into Basic 2.","Demonstrate the return from Basic 2 to Marca.","Show how oversized lateral movement affects the partner.","Observe leaders’ posture, movement size, and use of the arms."],"follower":["Demonstrate how the follower completes each lateral transfer without guessing.","Observe follower timing and balance.","Support couples who lose the pulse during the transition."],"task":["Begin in Marca.","Enter Basic 2.","Repeat it at least once.","Return to Marca.","Adjust movement size to the available space and partner."],"success":"Most couples can move from Marca into Basic 2 and back without stopping, pulling, or travelling excessively.","errors":["Movement too large: “Reduce the distance, not the clarity.”","Leader uses only the hands: “Let your body establish the direction.”","Follower steps before receiving direction: “Remain available rather than predicting.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Repeat the same entry-and-recovery logic with Basic 1."},{"time":"39–46 min","title":"Basic 1 with a partner","purpose":"Add the compact grounded movement after students have already established connection through Basic 2.","leader":["Demonstrate Marca into Basic 1.","Demonstrate the exit back to Marca.","Explain that the leader should complete a movement before changing.","Observe leaders’ posture, movement size, and arm use."],"follower":["Demonstrate the follower role without anticipation.","Observe whether followers complete every transfer.","Correct students who collapse their posture or lean into the connection."],"task":["Begin in Marca.","Enter Basic 1.","Repeat it.","Return to Marca.","Avoid changing movement halfway through a transfer."],"success":"Couples complete Basic 1 together without arm force, rushing, or losing balance.","errors":["Leader changes too quickly: “Repeat before changing.”","Follower begins before the lead is clear: “Finish the current weight transfer first.”","Connection becomes rigid: “Keep the hands available, not fixed.”"],"safety":[],"rotation":"","transition":"The leader-role teacher explains that Marca, Basic 2, and Basic 1 are now choices rather than a fixed sequence."},{"time":"46–52 min","title":"Choosing between Marca, Basic 2, and Basic 1","purpose":"Move students from copying the teachers into making simple social-dance decisions.","leader":["First call the movement choices aloud.","Gradually reduce the prompts.","Ask leaders to choose one movement at a time.","Reinforce returning to Marca whenever uncertain.","Stop adding new information."],"follower":["Demonstrate following without knowing the next movement.","Observe followers who begin guessing.","Support students who lose confidence during transitions."],"task":["Choose Marca, Basic 2, or Basic 1.","Complete the current movement before changing.","Return to Marca when uncertain.","Complete every weight transfer.","Avoid guessing.","Maintain personal balance and comfortable connection."],"success":"Most couples can make several movement changes without stopping, pulling, or verbally coordinating.","errors":["Leader creates too many changes: “Use fewer choices and repeat them longer.”","Couple loses the pulse: “Return to Marca before rebuilding the flow.”"  safely, change direction, and restart without pulling, rushing, or losing the pulse.","movement":["Week 1 recap through Marca, Basic 1, and Basic 2","Basic 3","Forward walking","Backward walking","Torso-led direction","Controlled stop","Restart in the same direction","Stop before reversing direction","Return to Marca as recovery","Basic floorcraft awareness"],"foundation":["Complete the current weight transfer before travelling.","The body communicates direction before the free foot moves.","Steps remain underneath the body.","Backward steps remain short.","Both partners maintain personal balance.","The follower responds rather than predicts.","The leader checks the available space before travelling.","A stop is a complete balanced action, not a hesitation.","Restart only when both partners are stable."],"prerequisites":["Pulse","Complete weight transfer","Personal balance","Marca","Basic 1","Basic 2","Light partner connection","Returning to Marca when uncertain"],"core":["Marca","Basic 3","Three small travelling steps","Controlled stop","Return to Marca","Restart in the same direction"],"progressing":["Enter Basic 3 from Marca.","Extend Basic 3 into natural walking.","Stop and reverse direction.","Choose between travelling and stationary movement.","Adjust step size to the partner and floor space."],"challenge":["Vary travelling distance without changing the pulse.","Delay the restart for one or two pulses.","Use fewer verbal cues.","Change direction only after a clear balanced stop.","Add one small quarter-turn after the stop.","Enter from Basic 2 and exit through Marca."],"entries":[],"exits":[],"social":[],"errors":["Stepping before the body communicates: “Let the centre establish the direction first.”","Leader walks through follower space: “Create space for the follower’s step.”","Follower anticipates: “Complete what is happening before preparing the next step.”","Backward steps are too large: “Place the foot closer and keep your balance.”","Couple accelerates while travelling: “Keep the pulse; reduce the distance.”","Direction changes before the stop: “Complete, balance, then redirect.”","Leader pulls through the arms: “Communicate through the body, not the hands.”","Couple travels into another couple: “Stop while the space is still available.”","Students lose the flow after stopping: “Return to Marca and restart from clarity.”"],"safety":["Open hold remains valid throughout.","Backward steps must remain small.","No pulling, pushing, or forced acceleration.","Both partners remain responsible for personal balance.","Leaders must scan the available floor before travelling.","Students should stop before entering another couple’s space.","Students may decline a partner, role, or connection position.","Teachers explain physical corrections before making contact.","Students with balance concerns may practise the core version without travelling."],"questions":["Is six minutes enough to teach Basic 3 individually?","Do students need longer partner-direction practice before travelling?","Does Basic 3 help natural walking, or do students become too focused on the pattern?","Should the reverse-direction section remain core material?","Is the quarter-turn appropriate as a challenge, or should it be removed entirely until Week 3?","Do students stop early enough when space becomes limited?","Which demonstration angle makes torso-led direction easiest to understand?","Is five minutes sufficient for independent social practice?"],"previous":"Level 1, Week 1","next":"Level 1, Week 3","detailed":true,"sequence":[{"time":"0–5 min","title":"Welcome and Week 1 recap","purpose":"Reconnect students with the Week 1 foundations and identify anyone needing extra support before travelling.","leader":["Introduce the class promise.","Explain that the class adds travelling, not speed.","Lead a short recap of Marca, Basic 1, and Basic 2.","Reinforce complete weight transfer and small steps.","Explain that Marca remains the recovery option throughout "Introduce Basic 3 as the bridge between stationary basics and natural travelling.","leader":["Demonstrate Basic 3 with music.","Show the essential version slowly.","Connect it to the weight-transfer principles from Week 1.","Demonstrate entry from Marca.","Demonstrate exit back to Marca.","Avoid presenting it as a long memorised count."],"follower":["Demonstrate the follower role beside the leader-role teacher.","Show the movement from the opposite viewing angle.","Observe students skipping or tapping a step.","Reinforce that every step receives the body weight."],"task":["Dance Basic 3 individually.","Enter from Marca.","Repeat Basic 3.","Stop in balance.","Return to Marca.","Keep the movement compact."],"success":"Most students complete Basic 3 repeatedly without tapping, rushing, or losing the pulse.","errors":["Treating a step as a tap: “Every step receives your weight.”","Travelling too far: “Basic 3 can stay almost underneath you.”","Counting without hearing the pulse: “Let the music organise the steps.”"],"safety":[],"rotation":"","transition":"Explain that Basic 3 can gradually become natural walking."},{"time":"16–22 min","title":"Forward and backward walking individually","purpose":"Separate the technique of walking from the complexity of partner connection.","leader":["Demonstrate small forward steps.","Demonstrate small backward steps.","Show how the torso remains organised over the standing foot.","Demonstrate stopping before changing direction.","Set short travel lanes across the room."],"follower":["Demonstrate the same pathway from another angle.","Highlight safe backward step size.","Observe students leaning ahead of or behind their feet.","Reinforce looking forward rather than down."],"task":["Walk forward for several steps.","Stop in balance.","Walk backward with smaller steps.","Stop before reversing direction.","Keep the pulse and maintain awareness of surrounding students."],"success":"Most students travel and reverse direction without crossing their feet, leaning, or taking a correction step.","errors":["Backward steps too large: “Place the foot close enough to remain balanced.”","Upper body leaning: “Move the body with the step, not ahead of it.”","Reversing without stopping: “Complete, stop, then choose the new direction.”","Looking down: “Look through the room, not at your feet.”"],"safety":[],"rotation":"","transition":"Form partners and teach direction through connection without significant travel."},{"time":"22–28 min","title":"Partner connection and directional communication","purpose":"Teach how travel begins through the body rather than the arms.","leader":["Demonstrate a comfortable open connection.","Show the leader preparing forward movement through posture and centre.","Contrast torso-led direction with pushing through the hands.","Demonstrate a clear stop.","Keep the first movements extremely small."],"follower":["Explain the follower experience of receiving forward, backward, and stopping information.","Demonstrate waiting for direction instead of predicting.","Show how the follower maintains personal balance.","Observe followers moving before information is clear."],"task":["Communicate one small forward or backward step.","Stop before changing direction.","Keep the arms responsive rather than forceful.","Complete the current transfer.","Wait for the direction to become clear.","Keep personal balance.","Avoid stepping automatically."],"success":"Couples communicate single steps and stops without pushing, pulling, or verbally coordinating.","errors":["Leader moves the arms first: “Move your centre before your hands.”","Follower anticipates: “Wait until the direction is available.”","Couple leans into connection: “Stand independently and communicate through contact.”"],"safety":[],"rotation":"Rotate once at the end of the section.","transition":"Keep the new partner and introduce partnered Basic 3."},{"time":"28–35 min","title":"Basic 3 with a partner","purpose":"Apply Basic 3 through connection before extending it into longer walks.","leader":["Demonstrate Marca into Basic 3.","Repeat Basic 3 before changing.","Demonstrate a controlled stop.","Exit back to Marca.","Observe whether leaders use the torso or arms."],"follower":["Demonstrate completing each transfer without anticipating.","Observe follower balance and step size.","Reinforce that the follower does not need to know the pattern in advance."],"task":["Begin in Marca.","Enter Basic 3.","Repeat it several times.","Stop in balance.","Return to Marca.","Maintain light connection."],"success":"Most couples complete repeated Basic 3 cycles and stop without pulling or losing the pulse.","errors":["Leader changes direction halfway through a transfer: “Finish before redirecting.”","Follower rushes the final step: “Give every step the same time.”","Couple travels unintentionally: “Reduce the step until the pattern is controlled.”"],"safety":[],"rotation":"","transition":"Extend the same communication into several forward walking steps."},{"time":"35–42 min","title":"Forward travel with a partner","purpose":"Develop controlled travel while maintaining connection, pulse, and floorcraft.","leader":["Demonstrate the leader travelling forward while the follower travels backward.","Keep the pathway short.","Show how to scan the available floor before moving.","Demonstrate stopping before reaching another couple.","Observe leaders who walk through the follower’s space."],"follower":["Demonstrate safe backward walking.","Show how the follower places each foot underneath their own body.","Reinforce that the follower does not need to increase step size to match force.","Observe balance and anticipation."],"task":["Travel for three to five small steps.","Stop while space remains available.","Return to Marca.","Repeat only when the pathway is clear."],"success":"Couples travel a short distance and stop before entering another couple’s space.","errors":["Leader walks through follower space: “Create direction, then allow space for the follower’s step.”","Follower reaches backward: “Place the foot close, then transfer.”","Couple accelerates while travelling: “Keep the same pulse and reduce the distance.”","Leader watches only the partner: “Include the room in your awareness.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"With the new partner, practise stopping and reversing the travelling direction."},{"time":"42–48 min","title":"Stop and reverse direction","purpose":"Teach direction change as a stop followed by a new decision rather than an abrupt reversal.","leader":["Demonstrate forward travel.","Stop completely.","Confirm partner balance.","Restart in the opposite direction.","Show the unsafe version where direction changes before the follower finishes."],"follower":["Demonstrate completing the stop before responding to the new direction.","Explain that the free leg may change only after weight is clear.","Observe followers carrying momentum through the stop."],"task":["Travel for a few steps.","Stop.","Hold the stop for one pulse.","Restart in the opposite direction.","Return to Marca if the direction becomes unclear."],"success":"Most couples reverse direction without stumbling, pulling, or adding corrective steps.","errors":["Reversal happens too early: “Complete the stop before creating the next direction.”","Leader pulls the follower back: “Invite the new direction through the centre.”","Follower continues travelling: “Finish the standing foot and wait.”"],"safety":[],"rotation":"","transition":"Add floorcraft decisions and allow leaders to choose whether to travel or remain in place."},{"time":"48–53 min","title":"Floorcraft and travel choices","purpose":"Shift from practising a fixed exercise into making safe social-dance decisions.","leader":["Explain that travelling is optional.","Ask leaders to scan the floor before moving.","Encourage Marca, Basic 1, or Basic 2 when space is limited.","Introduce the rule: stop before the space disappears.","Reduce verbal instructions gradually."],"follower":["Demonstrate responding to both travelling and stationary choices.","Observe followers who continue moving after the leader stops.","Reinforce compact backward steps."],"task":["Choose between remaining in place and travelling.","Travel only when a clear pathway exists.","Stop early.","Use Marca when space becomes limited.","Complete each transfer.","Avoid predicting whether the couple will travel.","Maintain personal balance during stops and restarts."],"success":"Couples change between stationary movements and walking without collisions or verbal negotiation.","errors":["Travelling because it was practised: “Travel is a choice, not a requirement.”","Stopping too late: “Protect the space before it disappears.”","Couple loses the pulse while scanning: “Return to Marca and reorganise.”"],"safety":[],"rotation":"Rotate once before the final social-dance task.","transition":"Explain the limited vocabulary and floorcraft rule for independent practice."},{"time":"53–58 min","title":"Guided independent social dance","purpose":"Integrate Week 1 vocabulary with Basic 3, walking, stopping, and restarting.","leader":["Start a clear beginner-friendly track.","Remind leaders to travel only when space is available.","Limit prompts to complete the transfer, check the space, stop early, and return to Marca.","Gradually stop speaking.","Correct only high-impact or repeated issues."],"follower":["Circulate on the opposite side of the room.","Observe balance during backward walking.","Reinforce waiting through stops.","Join temporarily if roles are uneven."],"task":["Dance continuously using the allowed vocabulary.","The central rule is:","Travel only when space is available. Stop before reaching another couple, then restart when the direction and pulse are clear."],"success":"Most couples travel, stop, and restart independently without pulling, rushing, or colliding.","errors":[],"safety":[],"rotation":"","transition":""}, ntry from Basic 3","Several Estrela steps","Choice between walking and Marca exits","Adapt movement size to partner and space"],"challenge":["Change the number of Estrela steps.","Pause for one pulse before exiting.","Exit on a different orientation.","Enter from Marca.","Create the open corridor that previews Leader's Saída."],"entries":[],"exits":[],"social":[],"errors":["Turning with the arms: “Move around the centre before moving the hands.”","Follower crosses unintentionally: “Walk each step around the centre.”","Circle becomes too large: “Reduce the step and protect the centre.”","Planted-knee twisting: “Release the foot before changing orientation.”","Exit starts too early: “Finish the circular step first.”","Follower predicts the exit: “Continue the current pathway until it changes.”","Couple loses orientation: “Return to Marca and rebuild the direction.”"],"safety":["Keep the rotation compact.","Turn through the feet and body rather than twisting a planted leg.","Open hold remains valid.","No pulling, pushing, or forced close connection.","Both partners remain responsible for personal balance.","Students may decline a partner, role, or physical correction.","Rotate only when sufficient floor space is already available."],"questions":["Is eight minutes sufficient for partnered Estrela?","Should entry from Marca remain a challenge or become core?","Do students understand the shared centre before seeing the full figure?","Does teaching two exits improve adaptability or create overload?","Are students walking around the centre or spinning?","Does the Estrela remain compact with a new partner?","Which exit causes more anticipation?","Is five minutes enough for independent practice?"],"previous":"Level 1, Week 2","next":"Level 1, Week 4","detailed":true,"sequence":[{"time":"0–5 min","title":"Welcome and Week 2 recap","purpose":"Reconnect walking, stopping, and floorcraft before adding rotation.","leader":["Introduce the class promise.","Explain that rotation is walking around a shared centre.","Lead Marca, Basic 3, and short forward travel.","Add controlled stops.","Reinforce scanning the floor before moving."],"follower":["Demonstrate small backward walking.","Observe weight transfer and backward step size.","Support students who remain unstable after stopping.","Reinforce personal balance."],"task":["Dance Marca and Basic 3 individually.","Walk forward and backward.","Stop in balance.","Restart without an adjustment step."],"success":"Most students walk and stop with stable weight before rotation is introduced.","errors":[],"safety":[],"rotation":"","transition":"Keep students individual and introduce safe quarter-turns."},{"time":"5–11 min","title":"Quarter-turn preparation individually","purpose":"Teach the physical turning action before partner connection.","leader":["Demonstrate a quarter-turn using small steps.","Show how both feet and the body reorganise together.","Contrast safe turning with twisting over a planted foot.","Use four directions in the room as visual references.","Ask students to finish each turn before continuing."],"follower":["Demonstrate from a second angle.","Observe knees, foot placement, and balance.","Support students who rotate only the shoulders.","Reinforce small movement size."],"task":["Step and complete a quarter-turn.","Reorganise both feet beneath the body.","Pause in balance.","Repeat in the same direction.","Avoid twisting on a fixed leg."],"success":"Most students complete quarter-turns without crossing, hopping, or twisting the standing knee.","errors":["Upper body turns before the feet: “Let the feet and body arrive together.”","Planted-foot twisting: “Release the foot before changing orientation.”","Turn too large: “One quarter is enough.”","Loss of balance: “Reduce the step and finish the standing foot.”"],"safety":[],"rotation":"","transition":"Connect consecutive quarter-turns into a compact circular walk."},{"time":"11–16 min","title":"Circular walking individually","purpose":"Help students understand the geometry of Estrela without partner complexity.","leader":["Mark a small imaginary centre.","Demonstrate walking around it with compact steps.","Show that the body remains oriented toward the centre.","Demonstrate a controlled exit into a straight walk.","Avoid prescribing an exact number of steps."],"follower":["Demonstrate the same circle from the opposite side.","Observe students drifting away from the centre.","Reinforce smooth continuous transfer.","Correct students who cross their feet unintentionally."],"task":["Walk around a small imaginary centre.","Keep the circle compact.","Maintain the pulse.","Exit after several steps into a chosen direction.","Repeat without rushing."],"success":"Students maintain a recognisable compact circle and exit without losing balance.","errors":["Circle expands: “Keep the centre close.”","Feet cross: “Walk around the circle; do not wrap the legs.”","Students spin instead of walk: “One complete step at a time.”","Exit is abrupt: “Finish the circle before choosing the line.”"],"safety":[],"rotation":"","transition":"Show how two people share the centre."},{"time":"16–22 min","title":"Shared-centre partner drill","purpose":"Establish circular communication before teaching the full Estrela.","leader":["Demonstrate a light open connection.","Establish a shared centre between the partners.","Walk one or two small clockwise steps.","Demonstrate the incorrect arm-led version.","Emphasise that both partners move around the centre."],"follower":["Explain the follower experience.","Demonstrate maintaining personal axis.","Show the difference between travelling around the centre and being pulled around it.","Observe anticipation and crossed feet."],"task":["Establish comfortable connection.","Walk one or two clockwise steps together.","Stop in balance.","Return to Marca.","Keep the centre compact and stable."],"success":"Couples rotate slightly without pulling, leaning, or widening the circle.","errors":["Lea he rotational step before following the new line.","Explain how the follower recognises the exit.","Observe momentum carrying followers past the intended direction."],"task":["Dance the Estrela.","Complete the current circular step.","Follow the quarter-turn exit.","Continue for two or three walking steps.","Stop safely."],"success":"Couples leave the circle on a clear line without stumbling or pulling.","errors":["Exit begins halfway through a transfer: “Finish the circle step first.”","Leader pulls the follower into the line: “Prepare the new direction through the centre.”","Exit travels too far: “Choose the line; keep the steps small.”","Follower continues rotating: “Complete the current step and receive the new direction.”"],"safety":[],"rotation":"","transition":"Introduce Marca as the second exit choice."},{"time":"36–42 min","title":"Quarter-turn exit into Marca","purpose":"Provide a compact recovery exit when travelling space is unavailable.","leader":["Demonstrate the Estrela.","Complete the quarter-turn.","Settle into Marca instead of travelling.","Explain when this exit is useful.","Compare both exits clearly."],"follower":["Demonstrate settling weight before Marca.","Reinforce that stopping rotation does not mean freezing.","Observe followers who continue travelling."],"task":["Enter Estrela from Basic 3.","Choose the quarter-turn exit.","Settle into Marca.","Rebuild the pulse.","Repeat with the other exit."],"success":"Couples can distinguish between exiting into walking and exiting into Marca.","errors":["Students stop between both feet: “Arrive on one foot, then continue Marca.”","Rotation continues after the exit: “Complete the new orientation.”","Leaders choose too late: “Prepare the exit before the final step.”"],"safety":[],"rotation":"Rotate at the end of this section.","transition":"Ask students to practise choosing between both exits with the new partner."},{"time":"42–48 min","title":"Entry, repetition, and exit choices","purpose":"Move from a sing the first.","Continue forward while keeping both lanes clear."],"follower":["Demonstrate the follower remaining in the original lane.","Show the collision created when the leader steps diagonally across the follower's line.","Observe spacing and step size."],"task":["Walk forward in one lane.","Move into the adjacent lane using a compact side step.","Continue walking without crossing the original line.","Return to the starting lane in balance."],"success":"Students can change lanes while preserving a clear parallel pathway.","errors":["Diagonal crossing: “Move beside the lane, not through it.”","Side step too large: “Create only the space you need.”","Feet crossing: “Keep each step underneath your own pathway.”"],"safety":[],"rotation":"","transition":"Assign students the leader-role pathway and repeat the lane change."},{"time":"10–16 min","title":"Leader pathway individually","purpose":"Teach the leader footpath before connection adds complexity.","leader":["Demonstrate the essential Leader's Saída pathway without a partner.","Show the entry, corridor walk, and return.","Emphasise keeping the torso aligned with the intended lane.","Avoid presenting a long count-based sequence."],"follower":["Stand in the follower lane as a visual reference without connection.","Show where a collision would occur if the leader enters the follower's line.","Observe students who rotate unnecessarily."],"task":["Enter the adjacent lane.","Take two or three compact walking steps.","Prepare the return.","Re-enter the original orientation without crossing the imagined follower pathway."],"success":"Most students complete the leader pathway without stepping through the follower lane.","errors":["Leader rotates too much: “Change lane first; keep the pathway simple.”","Return begins late: “Prepare the return before the lanes close.”","Steps travel too far: “Keep the corridor compact.”"],"safety":[],"rotation":"","transition":"Form partners and create the corridor with minimal travel."} ter from Basic 3.","Pause after the follower enters the side pathway.","Observe preparation, lane protection, and arm use."],"follower":["Demonstrate the follower pathway.","Explain receiving the redirection without anticipating.","Reinforce personal axis and complete transfer.","Observe forced torso rotation or oversized steps."],"task":["Begin in Basic 3.","Complete the preparation.","Guide or follow the follower's lateral entry.","Take one controlled side step.","Stop in balance before returning."],"success":"Most couples enter the Follower's Saída with a visible corridor and no arm-led redirection.","errors":["Leader blocks the follower path: “Move out of the corridor before inviting the step.”","Follower predicts the entry: “Stay with Basic 3 until the pathway changes.”","Connection becomes rigid: “Let weight and direction communicate the movement.”","Follower loses axis: “Keep the step underneath your own body.”"],"safety":[],"rotation":"","transition":"Extend the follower pathway into a short lateral walk."},{"time":"30–36 min","title":"Lateral walk","purpose":"Develop controlled follower travel while the leader preserves the corridor.","leader":["Demonstrate one to three compact lateral steps.","Keep the leader outside the follower pathway.","Show how excessive arm guidance disrupts balance.","Observe leaders who follow into the corridor."],"follower":["Demonstrate independent lateral walking.","Reinforce equal timing and complete transfer.","Observe crossing, reaching, or forced hip movement."],"task":["Enter the Follower's Saída.","Continue for one to three lateral steps.","Maintain the pulse.","Keep the follower pathway open.","Stop before the return."],"success":"Couples complete a short lateral walk with the follower balanced and the corridor clear.","errors":["Leader follows into follower line: “Protect the corridor from outside it.”","Follower reaches sideways: “Place the foot closer and transfer fully.”","Timing separates: “Keep one shared pulse acro
