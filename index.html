<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Tribe Kizomba Curriculum</title><style>body{margin:0;background:#111015;color:#f7f2ef;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px}p{color:#bbb2bf}</style></head><body><main><h1>Loading The Tribe curriculum…</h1><p>Preparing the latest approved programme.</p></main><script>const base='https://raw.githubusercontent.com/rovigomanucci/the-tribe-kizomba-course/0cb494bcc9842ef53d195a3a280e1ae68061e56c/.site-bundle/';Promise.all(['part-00.b64','part-01.b64','part-02.b64','part-03.b64'].map(f=>fetch(base+f).then(r=>{if(!r.ok)throw new Error('Failed to load '+f);return r.text()}))).then(parts=>{const binary=atob(parts.join(''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}).catch(error=>{document.querySelector('main').innerHTML='<h1>Unable to load the curriculum</h1><p>'+error.message+'</p>'});</script></body></html>
