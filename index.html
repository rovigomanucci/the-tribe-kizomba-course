.”","Release projects the partner: “Reduce shared load before choosing the line.”","Cross begins under load: “Restore a clear standing side first.”","Combining too many techniques: “Choose one exit and return to dancing.”","Rotation exceeds control: “Reduce both angle and counterbalance range.”"],"safety":["No surprise counterbalances or automatic advanced variations.","Keep ranges small and self-recoverable.","Rotational counterbalance requires stable recovery and fresh agreement.","No lift under load or hook behind the knee.","Avoid dynamic counterbalance with unresolved back, knee, balance, or trust concerns.","Teachers explain corrections before physical contact."],"questions":["Is counterbalance into cross achievable for the weakest admitted student?","Do students reduce range when adding direction?","Does pivot entry improve flow or encourage over-combination?","Should rotational counterbalance remain outside the core curriculum?","Which musical texture supports redirection without projection?"],"previous":"Level 2, Week 6","next":"Level 2, Week 8","detailed":true,"sequence":[{"time":"0–5 min","title":"Week 6 recovery check","purpose":"Confirm the foundation before adding direction change.","leader":["Lead static and linear counterbalance with full recovery.","Observe range, frame, and whether students walk too early.","State the rule: recover first, redirect second."],"follower":["Demonstrate personal structure and active return to axis.","Identify students who should remain with Week 6 core work."],"task":["Prepare, enter one small counterbalance, recover to individual axes, and walk out."],"success":"Most couples recover without hanging, rebound, or correction steps.","errors":[],"safety":[],"rotation":"","transition":"Separate and practise absorbing a direction change individually."},{"time":"5–10 min","title":"Individual recovery and redirection","purpose":"Teach control of momentum before partner work.","leader":["Demonstrate a small inclined line, return toward vertical, then step into a new direction.","Show why redirecting before recovery causes instability."],"follower":["Demonstrate soft knees, organised trunk, and controlled directional step.","Observe collapsing, hopping, or overtravelling."],"task":["Create a minimal inclination, recover nearly to vertical, then step into a new line and stop."],"success":"Students change direction without falling into the new step.","errors":["Direction changes too early: “Recover before you redirect.”","Step absorbs uncontrolled momentum: “Reduce the range and own the landing.”","Upper body leads without feet: “Let the whole body reorganise.”"],"safety":[],"rotation":"","transition":"Form partners and add a small direction change after static counterbalance."},{"time":"10–16 min","title":"Partner redirection preparation","purpose":"Establish shared timing without completing a full dynamic action.","leader":["Demonstrate preparation, static counterbalance, beginning recovery, and a tiny directional invitation.","Stop before travel.","Contrast redirection with pulling the partner sideways."],"follower":["Explain recognising the recovery before receiving the new line.","Demonstrate staying active rather than being carried."],"task":["Enter, recover partway, acknowledge one new direction, return to neutral, and reset."],"success":"Couples agree on the new direction without arm force or sudden load.","errors":[],"safety":[],"rotation":"Rotate once and recalibrate range.","transition":"Complete the direction-change exit."},{"time":"16–23 min","title":"Counterbalance with direction change","purpose":"Teach the core dynamic redirection with a clear recovery point.","leader":["Demonstrate small counterbalance, shared recovery, new direction, and complete stop.","Keep the change below a quarter turn for the core room.","Observe whether leaders use stored tension to throw the partner."],"follower":["Demonstrate active recovery and controlled response to the new line.","Observe late recovery and overtravel."],"task":["Prepare, enter, hold briefly, recover, change direction once, stop, and return to neutral."],"success":"Direction changes remain compact and both partners control the endpoint.","errors":["Release becomes projection: “Reduce the shared load before redirecting.”","Follower is carried: “Recover through your own structure.”","New direction is too large: “Choose a smaller angle.”"],"safety":[],"rotation":"","transition":"Use the recovered free leg to create a cross."},{"time":"23–30 min","title":"Counterbalance into cross","purpose":"Connect redirection to Week 1 crossing without combining before control.","leader":["Demonstrate counterbalance, recovery, clear free-leg recognition, small cross, and pause.","Show the unsafe cross created while the partner is still loaded."],"follower":["Demonstrate keeping both legs unavailable until recovery restores a stable standing side.","Reinforce that the cross remains unweighted until clearly led."],"task":["Recover from counterbalance, identify the free leg, guide one cross, replace or transfer clearly, and walk out."],"success":"The cross begins after recovery and does not absorb unresolved momentum.","errors":["Cross begins under load: “Return toward axis before leg action.”","Weighted leg is contacted: “Wait until the standing side is certain.”","Follower transfers automatically: “Cross first; weight only when invited.”"],"safety":[],"rotation":"Rotate at the end of the section.","transition":"Simplify the recovery into a walk-out."},{"time":"30–37 min","title":"Counterbalance exit into walk","purpose":"Create the most socially useful dynamic recovery.","leader":["Demonstrate prepare, enter, recover, establish a clear walking line, and use two or three compact steps.","Emphasise scanning floor space before exit."],"follower":["Demonstrate waiting for the direction after the shared load has reduced.","Observe rebound and oversized first steps."],"task":["Exit one small counterbalance into a short walk, stop safely, and return to Basic 3."],"success":"Couples walk out with normal step size and no sudden acceleration.","errors":["First step is too large: “Use a normal social step after recovery.”","Couple accelerates: “Do not convert tension into speed.”","Floor space is ignored: “Choose the exit only when the line is clear.”"],"safety":[],"rotation":"","transition":"Connect the entry to a completed pivot."},{"time":"37–43 min","title":"Entry from completed pivot","purpose":"Integrate Week 4 rotation while maintaining sequential clarity.","leader":["Demonstrate quarter pivot, complete recovery, explicit counterbalance preparation, small entry, and walk-out.","Keep open-line entry available as core."],"follower":["Demonstrate finishing rotation before accepting shared load.","Observe blended actions and missing preparation."],"task":["Choose open-line or completed-pivot entry, complete one dynamic counterbalance, and recover to walking."],"success":"Each element has a visible completion point.","errors":[],"safety":[],"rotation":"","transition":"Offer a small leg-lift exit only to stable couples."},{"time":"43–49 min","title":"Optional counterbalance into small leg lift","purpose":"Test integration while preserving all Week 3 safety rules.","leader":["Demonstrate full counterbalance recovery, free-leg preparation, tiny lift, replacement, and walk-out.","Keep cross or walk exit as the core task."],"follower":["Demonstrate grounded axis and no jumping.","Reinforce that the lift disappears if the free leg or recovery is unclear."],"task":["Core students use cross or walk exit. Progressing students, after stable recovery, add one tiny lift and controlled replacement."],"success":"The lift remains small and begins only after the counterbalance has resolved.","errors":[],"safety":[],"rotation":"","transition":"Introduce rotational counterbalance only as a demonstration and optional challenge."},{"time":"49–54 min","title":"Optional rotational counterbalance","purpose":"Clarify the conditions required for rotation without making it a class requirement.","leader":["Demonstrate a minimal rotational change with very small counterbalance range.","Show the safe alternative: ordinary direction change.","Require stable Week 6 recovery before participation."],"follower":["Demonstrate maintaining body line and completing rotation through the feet.","Reinforce opting out or reducing range."],"task":["Most students repeat the core direction change. Stable consenting couples may explore one minimal rotational variation and return to neutral."],"success":"No rotational action uses deep range, surprise load, or planted-knee twisting.","errors":[],"safety":[],"rotation":"Rotate once before final practice; return to static calibration first.","transition":"State the independent task."},{"time":"54–58 min","title":"Guided independent social dance","purpose":"","leader":["Prompt only: “Prepare,” “Recover first,” “Choose one exit,” “Small range,” and “Walk.”","Stop any projected release, carried weight, or rotation without recovery."],"follower":["Observe active structure, free-leg clarity, and partner consent.","Join temporarily if roles are uneven."],"task":[],"success":"Most couples use one controlled dynamic action and return immediately to ordinary social flow.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"58–60 min","title":"Recap and Week 8 connection","purpose":"","leader":["Recap prepare, enter, recover, redirect, complete, walk out.","Explain that Week 8 integrates the entire Level 2 vocabulary through musical and partner adaptation."],"follower":["Reinforce that recovery is the centre of every dynamic variation.","Ask which exit preserved the most control."],"task":["Identify the rule for combining: add only one new element after the previous one is fully controlled."],"success":"Students understand that dynamic does not mean large, fast, or uncontrolled.","errors":[],"safety":[],"rotation":"","transition":""}]},{"id":"l2w8","level":2,"week":8,"title":"Fusion Flow Challenge","status":"Draft — Test in class","promise":"By the end of the class, students will be able to build one short adaptable Fusion pathway, change its timing and texture, simplify it for a new partner, and recover safely whenever an element loses clarity.","movement":["Flow selection and reduction","Clear preparation and recovery points","Smooth interpretation","Sharp stop-driven interpretation","Slow suspended interpretation","Partner adaptation after rotation","Full song-section decision task"],"foundation":["Preparation precedes every advanced element.","Recovery separates elements and prevents uncontrolled stacking.","The current partner determines range and complexity.","Musical interpretation changes quality and timing, not safety rules.","Removing an element is a successful decision, not a failure.","Ordinary walking and Basic 3 remain valid exits at all times."],"prerequisites":["Students should have experience with all previous Level 2 weeks. No student is required to perform every advanced element. The starting version is determined by the safest reliable vocabulary each partnership shares."],"core":["Prepared Saída or open-line entry","One block, slide, cross, or pivot","Basic 3 or walking recovery","One musical texture"],"progressing":["Three to five connected elements","One lift or pivot","One suspension or static counterbalance","Adapted version with a new partner"],"challenge":["Dynamic counterbalance with controlled exit","Three distinct musical interpretations of the same movement family","Deliberate removal and replacement of elements according to music and partner response"],"entries":[],"exits":[],"social":[],"errors":["Performing sequence regardless of music: “Let the music choose quality and timing.”","Prioritising spectacle over response: “Reduce range until the partner remains clear.”","Skipping preparation: “No advanced element without a visible setup.”","Stacking techniques without recovery: “Complete, recover, then decide.”","Repeating the same flow with a new partner: “Rebuild from the vocabulary you both share.”","Continuing after control is lost: “Remove the element and return to walking.”"],"safety":["Every advanced element remains optional.","Fresh partner agreement is required for lifts, inclinations, and counterbalances.","No joint pressure, surprise load, deep range, or carried body weight.","Removing an unsafe or unclear element is the expected response.","Partner comfort and recovery override completing any planned flow.","Teachers explain corrections before physical contact."],"questions":["Is the original vocabulary menu too broad for one 60-minute integration class?","Do students genuinely reduce complexity after changing partner?","Which three-element core pathway best reveals course readiness?","Can students change texture without changing safety or range?","Does the final task assess social adaptability better than a fixed demonstration?","Which Level 2 elements should become optional specialist modules rather than core expectations?"],"previous":"Level 2, Week 7","next":"Cycle review","detailed":true,"sequence":[{"time":"0–5 min","title":"Welcome, readiness, and safety framing","purpose":"Set the class as an integration challenge rather than a performance test.","leader":["Explain the student-facing promise.","State that no partnership must use every advanced element.","Review the hierarchy: partner comfort, preparation, control, recovery, music, complexity.","Lead a short Basic 3 and Saída warm-up."],"follower":["Reinforce active follower responsibility, consent, and adaptation.","Identify students who should use a reduced core pathway."],"task":["Dance Basic 3, one Saída, one stop, and one recovery while checking balance and connection."],"success":"Students understand that simplification and recovery are central assessment behaviours.","errors":[],"safety":[],"rotation":"","transition":"Separate and explore three movement textures without partner complexity."},{"time":"5–11 min","title":"Three textures individually","purpose":"Differentiate musical interpretation from movement vocabulary.","leader":["Demonstrate the same simple walk with smooth continuous quality, sharp stop-driven quality, and slow suspended quality.","Keep the step pattern unchanged.","Explain that texture changes timing, energy, and continuity."],"follower":["Demonstrate from a second angle.","Observe students who increase range or add styling instead of changing texture."],"task":["Use one walking pattern in all three textures while preserving balance and pulse."],"success":"Students visibly change movement quality without changing the basic pathway or losing control.","errors":["Sharp becomes aggressive: “Create clarity, not force.”","Suspended becomes frozen: “Keep breath and pulse alive.”","Smooth loses structure: “Continuous does not mean collapsed.”"],"safety":[],"rotation":"","transition":"Form partners and choose a reduced vocabulary set."},{"time":"11–17 min","title":"Partnership vocabulary selection","purpose":"Build an honest shared starting point before creating a flow.","leader":["Ask each couple to select three reliable elements: one entry, one featured action, and one recovery.","Demonstrate a simple example: Saída, block, walk-out.","Require an explicit agreement before lifts or counterbalances."],"follower":["Encourage followers to identify which elements feel clear and which should be removed.","Observe partnerships selecting too many actions."],"task":["Choose three shared elements and practise each separately with its preparation and recovery."],"success":"Each couple can perform the selected elements individually before connecting them.","errors":[],"safety":[],"rotation":"No rotation yet; establish the first shared version.","transition":"Connect the three elements with visible recovery points."},{"time":"17–24 min","title":"Build the core Fusion pathway","purpose":"Create a short adaptable flow without erasing the boundaries between techniques.","leader":["Demonstrate entry, featured action, recovery, second action, and final walk-out.","Mark each completion point.","Encourage fewer elements and more clarity."],"follower":["Demonstrate following without memorising the order.","Reinforce completing each transfer before the next preparation."],"task":["Build a pathway of three to five elements using at least one ordinary recovery between advanced actions."],"success":"The follower can follow the pathway without being told the order, and each action has a clear endpoint.","errors":["Elements blend together: “Complete and recover before the next preparation.”","Flow depends on memorisation: “Lead one decision at a time.”","Pathway is too long: “Remove one element and improve the transitions.”"],"safety":[],"rotation":"","transition":"Test the block-slide-cross family as one optional cluster."},{"time":"24–30 min","title":"Blocks, slides, and crosses integration","purpose":"Review free-leg logic while preventing repeated leg manipulation.","leader":["Demonstrate stop, free-leg check, one block or slide, optional cross, release, and walk-out.","Require only one leg-contact action per phrase."],"follower":["Demonstrate stable standing-side control and active free-leg response.","Observe joint contact, automatic transfer, and loss of axis."],"task":["Choose one block, slide, or cross pathway and connect it to the core flow. Remove any element that becomes unclear."],"success":"Leg contact remains low, light, isolated, and followed by recovery.","errors":[],"safety":[],"rotation":"","transition":"Test lift-pivot integration as a separate optional cluster."},{"time":"30–36 min","title":"Lifts and pivots integration","purpose":"Review axis control and sequence order without requiring both elements.","leader":["Demonstrate a small lift-and-replace followed later by a quarter pivot.","Show that lift and pivot do not need to be combined directly.","Offer pivot-only ,"success":"Students place suspension selectively and preserve the underlying rhythm.","errors":[],"safety":[],"rotation":"","transition":"Set the final independent song-section challenge."},{"time":"57–59 min","title":"Independent Fusion challenge","purpose":"","leader":["Observe preparation, musical choice, partner adaptation, and recovery.","Avoid prompting specific moves.","Intervene only for safety or repeated loss of control."],"follower":["Observe followability, consent, axis, and whether feedback changes the flow.","Join temporarily if roles are uneven."],"task":[],"success":"Couples make independent choices, simplify when necessary, and complete the section without spectacle-driven force.","errors":[],"safety":[],"rotation":"","transition":""},{"time":"59–60 min","title":"Course recap and completion","purpose":"","leader":["Recap the Level 2 hierarchy: prepare, recognise, guide, control, recover, interpret, adapt.","State that course completion reflects safe adaptable social use, not mastery of every figure."],"follower":["Reinforce partner response and personal responsibility.","Invite one brief reflection on the most reliable Level 2 skill."],"task":["Identify one technique they can use reliably and one that still requires reduced range or further practice."],"success":"Students can describe their own safe working vocabulary and recovery strategy.","errors":[],"safety":[],"rotation":"","transition":""}]}]}];
const state={level:0,lesson:'open-night'};
let storage;try{storage=window.localStorage;storage.getItem('tribe-kizomba-storage-test')}catch(error){storage={getItem:()=>null,setItem:()=>{}}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=items=>items?.length?'<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>Not specified in the current plan.</p>';
const activeLevel=()=>programme.find(x=>x.level===state.level||state.level===0&&x.id==='open-night');
const allLessons=()=>programme.flatMap(level=>level.lessons.map(lesson=>({...lesson,levelName:level.name})));
const currentLesson=()=>allLessons().find(x=>x.id===state.lesson);
function renderTabs(){document.querySelector('#levelTabs').innerHTML=programme.map(level=>'<button class="'+(level.level===state.level?'active':'')+'" data-level="'+level.level+'">'+(level.label||'Level '+level.level)+'</button>').join('');document.querySelectorAll('[data-level]').forEach(button=>button.onclick=()=>selectLevel(Number(button.dataset.level)));}
function renderSidebar(){const level=activeLevel();document.querySelector('#sidebar').innerHTML='<h2>'+esc(level.name)+'</h2><p>'+esc(level.descriptor)+'</p><div class="readiness"><span class="eyebrow">Readiness</span>'+esc(level.readiness)+'</div><div class="week-list">'+level.lessons.map(lesson=>'<button class="week-button '+(lesson.id===state.lesson?'active':'')+'" data-lesson="'+lesson.id+'"><span class="week-number">'+(lesson.week||'ON')+'</span><span class="week-copy"><b>'+esc(lesson.title)+'</b><span>'+esc(lesson.detailed?'Detailed 60-minute plan':'Structured class plan')+'</span></span></button>').join('')+'</div>';document.querySelectorAll('[data-lesson]').forEach(button=>button.onclick=()=>selectLesson(button.dataset.lesson));}
function infoCard(label,content){return '<article class="info-card"><span class="eyebrow">'+label+'</span>'+list(content)+'</article>'}
function renderTimeline(lesson){return lesson.sequence.map((block,index)=>'<details class="timeline-card" '+(index===0?'open':'')+'><summary class="timeline-summary"><span class="time">'+esc(block.time)+'</span><span><h3>'+esc(block.title)+'</h3><p>'+esc(block.task?.[0]||block.purpose)+'</p></span><span class="chevron">⌄</span></summary><div class="timeline-body"><div class="timeline-grid"><div class="mini"><span class="eyebrow">Student task</span>'+list(block.task)+'</div><div class="mini"><span class="eyebrow">Success signal</span><p>'+esc(block.success)+'</p></div></div><button class="notes-button" data-note="'+index+'">View teaching notes →</button></div></details>').join('');}
function detailCard(title,items,extra=''){return '<article class="detail-card '+extra+'"><h3>'+esc(title)+'</h3>'+list(items)+'</article>'}
function renderLesson(){const lesson=currentLesson();document.body.className=state.level===2?'level-2':state.level===0?'open-night':'';document.querySelector('#lesson').innerHTML='<div class="breadcrumbs"><span>'+(state.level===0?'Open Night':'Level '+state.level)+'</span><span>›</span><span>'+(lesson.week?'Week '+lesson.week:'Introduction')+'</span></div><section class="hero"><div class="hero-row"><div><h1>'+esc(lesson.title)+'</h1><p class="promise">'+esc(lesson.promise)+'</p></div></div><div class="badges"><span class="badge strong">60 minutes</span><span class="badge">'+esc(lesson.status)+'</span><span class="badge">'+(lesson.detailed?'Detailed source plan':'Structured from curriculum outline')+'</span></div></section><section class="overview">'+infoCard('Headline movement',lesson.movement)+infoCard('Technical foundation',lesson.foundation)+infoCard('Prerequisites',lesson.prerequisites)+'</section><div class="section-head"><div><span class="eyebrow">Teaching sequence</span><h2>60-minute class flow</h2></div><p>Open a section, then view role-specific teaching notes.</p></div><section class="timeline">'+renderTimeline(lesson)+'</section><div class="section-head"><div><span class="eyebrow">Class toolkit</span><h2>Options, safety, and review</h2></div></div><section class="detail-grid">'+detailCard('Core version',lesson.core)+detailCard('Progressing version',lesson.progressing)+detailCard('Challenge version',lesson.challenge)+detailCard('Entry options',lesson.entries)+detailCard('Exit options',lesson.exits)+detailCard('Common errors',lesson.errors)+detailCard('Safety and consent',lesson.safety,'full')+detailCard('Social-dance task',lesson.social,'full')+detailCard('Open questions and test points',lesson.questions,'full')+'</section><nav class="bottom-nav" id="bottomNav"></nav>';
document.querySelectorAll('[data-note]').forEach(button=>button.onclick=()=>openNotes(lesson.sequence[Number(button.dataset.note)]));renderBottomNav();}
function renderBottomNav(){const lessons=allLessons();const index=lessons.findIndex(x=>x.id===state.lesson);const previous=lessons[index-1],next=lessons[index+1];document.querySelector('#bottomNav').innerHTML=(previous?'<button class="ghost" data-jump="'+previous.id+'">← '+esc(previous.title)+'</button>':'')+(next?'<button class="ghost" data-jump="'+next.id+'">'+esc(next.title)+' →</button>':'');document.querySelectorAll('[data-jump]').forEach(button=>button.onclick=()=>jumpTo(button.dataset.jump));}
function noteSection(title,content,isList=true){if(!content||Array.isArray(content)&&!content.length)return'';return '<section class="note-section"><h3>'+esc(title)+'</h3>'+(isList?list(content):'<p>'+esc(content)+'</p>')+'</section>'}
function openNotes(block){document.querySelector('#sheet').innerHTML='<div class="sheet-head"><div><span class="eyebrow">'+esc(block.time)+'</span><h2>'+esc(block.title)+'</h2></div><button class="ghost sheet-close" id="sheetClose" aria-label="Close teaching notes">×</button></div>'+noteSection('Purpose',block.purpose,false)+noteSection('Leader-role teacher actions',block.leader)+noteSection('Follower-role teacher actions',block.follower)+noteSection('Student task',block.task)+noteSection('Success signal',block.success,false)+noteSection('Common errors and correction cues',block.errors)+noteSection('Safety and consent',block.safety)+noteSection('Partner rotation',block.rotation,false)+noteSection('Transition',block.transition,false);document.querySelector('#sheetBackdrop').classList.add('open');document.querySelector('#sheetClose').onclick=closeNotes;document.querySelector('#sheetClose').focus();}
function closeNotes(){document.querySelector('#sheetBackdrop').classList.remove('open')}
function selectLevel(level){state.level=level;const target=activeLevel().lessons[0];state.lesson=target.id;history.replaceState(null,'','#'+target.id);render();}
function selectLesson(id){state.lesson=id;history.replaceState(null,'','#'+id);renderSidebar();renderLesson();document.querySelector('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
function jumpTo(id){const lesson=allLessons().find(x=>x.id===id);state.level=lesson.level;state.lesson=id;history.replaceState(null,'','#'+id);render();window.scrollTo({top:0,behavior:'smooth'});}
function renderSearch(query=''){const q=query.trim().toLowerCase();const matches=allLessons().filter(lesson=>!q||[lesson.title,lesson.promise,...lesson.movement,...lesson.foundation].join(' ').toLowerCase().includes(q));document.querySelector('#results').innerHTML=matches.length?matches.map(lesson=>'<button class="result" data-result="'+lesson.id+'"><b>'+esc(lesson.title)+'</b><span>'+(lesson.level?'Level '+lesson.level+', Week '+lesson.week:'Open Night')+' · '+esc(lesson.movement.join(', '))+'</span></button>').join(''):'<div class="empty">No matching classes</div>';document.querySelectorAll('[data-result]').forEach(button=>button.onclick=()=>{closeSearch();jumpTo(button.dataset.result)});}
function openSearch(){document.querySelector('#searchWrap').classList.add('open');renderSearch();setTimeout(()=>document.querySelector('#searchInput').focus(),0)}function closeSearch(){document.querySelector('#searchWrap').classList.remove('open');document.querySelector('#searchInput').value=''}
function applyTheme(theme,persist=false){const next=theme==='light'?'light':'dark';document.documentElement.dataset.theme=next;document.querySelector('meta[name="theme-color"]').setAttribute('content',next==='light'?'#f7f4f1':'#0d0b10');const button=document.querySelector('#themeButton');const target=next==='dark'?'light':'dark';button.innerHTML='<span class="theme-icon" aria-hidden="true">'+(next==='dark'?'☀':'☾')+'</span><span class="theme-label">'+(next==='dark'?'Light':'Dark')+'</span>';button.setAttribute('aria-label','Switch to '+target+' theme');button.title='Switch to '+target+' theme';button.setAttribute('aria-pressed',String(next==='light'));if(persist)storage.setItem('tribe-kizomba-theme',next)}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true)}
function render(){renderTabs();renderSidebar();renderLesson()}
document.querySelector('#menuButton').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#searchButton').onclick=openSearch;document.querySelector('#themeButton').onclick=toggleTheme;document.querySelector('#searchInput').oninput=e=>renderSearch(e.target.value);document.querySelector('#sheetBackdrop').onclick=e=>{if(e.target.id==='sheetBackdrop')closeNotes()};document.querySelector('#searchWrap').onclick=e=>{if(e.target.id==='searchWrap')closeSearch()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeNotes();closeSearch()}});
const hash=location.hash.slice(1);const initial=allLessons().find(x=>x.id===hash);if(initial){state.level=initial.level;state.lesson=initial.id}render();
applyTheme(document.documentElement.dataset.theme);
</script>
</body>
</html>
